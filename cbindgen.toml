language = "C"
include_guard = "RUSTO_H"
autogen_warning = "/* Warning: This file is automatically generated by cbindgen. Do not edit manually. */"
tab_width = 4
style = "type"
cpp_compat = true
usize_is_size_t = true

[export]
include = [
    "CTextResult",
    "ROCRHandle",
    "rocr_initialize",
    "rocr_free",
    "rocr_version",
    "rocr_detect_text_file",
    "rocr_detect_text_file_spatial",
    "rocr_detect_text_data",
    "rocr_detect_text_data_spatial",
    "rocr_detect_text_rgb",
    "rocr_detect_text_rgb_spatial",
    "rocr_free_results",
    "rocr_free_string",
]
exclude = [
    "INTER_LINEAR",
    "INTER_CUBIC",
    "BORDER_REPLICATE",
    "ROTATE_90_CLOCKWISE",
    "ffi_uniffi_rusto_rustbuffer_from_bytes",
    "ffi_uniffi_rusto_rustbuffer_free",
]

[parse]
parse_deps = false
clean = true

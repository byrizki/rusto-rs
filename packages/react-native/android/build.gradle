buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.2.0'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'dev.rusto.reactnative'
  compileSdkVersion safeExtGet('ReactNativeRusto_compileSdkVersion', 34)
  
  defaultConfig {
    minSdkVersion safeExtGet('ReactNativeRusto_minSdkVersion', 21)
    targetSdkVersion safeExtGet('ReactNativeRusto_targetSdkVersion', 34)
    versionCode 1
    versionName "0.1.2"

    ndk {
      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      // Include assets from both React Native package and main Android package
      assets.srcDirs = [
        'src/main/assets',
        '../../../android/src/main/assets'
      ]
      jniLibs.srcDirs = ['../../../android/src/main/jniLibs']
    }
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-native:+'
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
  
  // Link to the main RustO Android package
  implementation project(':rusto-android')
}

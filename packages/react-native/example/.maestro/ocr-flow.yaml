appId: com.rustonewarchexample
---
- launchApp:
    clearState: true
- assertVisible: "RustO! OCR"
- assertVisible:
    id: "run-tests-button"
- tapOn:
    id: "run-tests-button"
- extendedWaitUntil:
    visible:
      id: "test-status-detect"
      text: "SUCCESS"
    timeout: 30000
- assertVisible:
    id: "test-status-mod"
    text: "SUCCESS"
- assertVisible:
    id: "test-status-init"
    text: "SUCCESS"
- assertVisible:
    id: "test-status-detect"
    text: "SUCCESS"
- assertVisible:
    id: "test-status-spatial"
    text: "SUCCESS"
- assertVisible:
    id: "test-status-cleanup"
    text: "SUCCESS"
- scrollUntilVisible:
    element:
      id: "latest-ocr-card"
- assertVisible:
    id: "latest-ocr-header"
- assertVisible:
    id: "latest-ocr-payload"

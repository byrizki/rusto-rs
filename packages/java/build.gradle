plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.byrizki.rusto-rs'
version = '0.3.1'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty "jna.library.path", "${file("${rootDir}/../../target/release").absolutePath}:${file("${rootDir}/../../target/debug").absolutePath}"
    environment "LD_LIBRARY_PATH", "${file("${rootDir}/../../target/release").absolutePath}:${file("${rootDir}/../../target/debug").absolutePath}"
}

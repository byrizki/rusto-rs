plugins {
    id 'java-library'
}

group = 'com.byrizki.rusto'
version = '0.3.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty "jna.library.path", file("${rootDir}/../../target/debug").absolutePath
    environment "LD_LIBRARY_PATH", file("${rootDir}/../../target/debug").absolutePath
}

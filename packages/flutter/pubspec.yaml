name: rusto_flutter
description: Flutter plugin for RustO OCR library based on RapidOCR, Indra OCR, and pure-Rust MNN (rusto-nn).
version: 0.4.0
homepage: https://github.com/byrizki/rusto-rs

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  rusto: ^0.4.0

flutter:
  plugin:
    platforms:
      android:
        package: com.byrizki.rusto
        pluginClass: RustOPlugin
      ios:
        pluginClass: RustOPlugin

dependency_overrides:
  rusto:
    path: ../dart

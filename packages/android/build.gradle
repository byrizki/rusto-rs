plugins {
    id 'com.android.library' version '8.2.0'
    id 'org.jetbrains.kotlin.android' version '1.9.20'
    id 'maven-publish'
    id 'signing'
}

android {
    namespace 'com.byrizki.rusto'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            // Multi-arch support: ARMv7, ARM64, x86, x86_64
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // Prebuilt native libraries location
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Model files and dict files as assets
            assets.srcDirs = ['src/main/assets']
        }
    }
    
    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

publishing {
    repositories {
        maven {
            name = 'Maven'
            url = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            credentials {
                username = System.getenv('MAVEN_USERNAME')
                password = System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}

signing {
    def signingKey = System.getenv('SIGNING_KEY')
    def signingPassword = System.getenv('SIGNING_PASSWORD')
    def signingKeyId = System.getenv('SIGNING_KEY_ID')
    
    def hasKey = signingKey != null && !signingKey.trim().isEmpty()
    
    if (hasKey) {
        def normalizedKey = signingKey.trim()
        if (normalizedKey.contains('\\n')) {
            normalizedKey = normalizedKey.replace('\\n', '\n')
        }
        if (!normalizedKey.contains('BEGIN PGP PRIVATE KEY BLOCK')) {
            try {
                def decoded = new String(normalizedKey.decodeBase64(), 'UTF-8')
                if (decoded.contains('BEGIN PGP PRIVATE KEY BLOCK')) {
                    normalizedKey = decoded
                }
            } catch (Exception ignored) {}
        }
        
        if (signingKeyId != null && !signingKeyId.trim().isEmpty()) {
            def keyId = signingKeyId.trim()
            if (keyId.startsWith("0x") || keyId.startsWith("0X")) {
                keyId = keyId.substring(2)
            }
            if (keyId.length() > 8) {
                keyId = keyId.substring(keyId.length() - 8)
            }
            useInMemoryPgpKeys(keyId, normalizedKey, signingPassword ?: '')
        } else {
            useInMemoryPgpKeys(normalizedKey, signingPassword ?: '')
        }
    }
    
    required { hasKey }
    sign publishing.publications
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                
                groupId = 'com.byrizki.rusto'
                artifactId = 'rusto-android'
                version = '0.1.4'
                
                pom {
                    name = 'RustO! Android'
                    description = 'RustO! - Pure Rust OCR library for Android'
                    url = 'https://github.com/byrizki/rusto-rs'
                    
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    
                    developers {
                        developer {
                            id = 'rusto'
                            name = 'RustO Contributors'
                        }
                    }
                    
                    scm {
                        connection = 'scm:git:git://github.com/byrizki/rusto-rs.git'
                        developerConnection = 'scm:git:ssh://github.com/byrizki/rusto-rs.git'
                        url = 'https://github.com/byrizki/rusto-rs'
                    }
                }
            }
        }
    }
}

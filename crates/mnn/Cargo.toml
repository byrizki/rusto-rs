[package]
name = "rusto-mnn"
version = "0.2.3"
edition = "2021"
description = "Safe Rust bindings to MNN library"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"
homepage = "https://github.com/byrizki/rusto-rs"
documentation = "https://docs.rs/rusto-mnn"
readme = "README.md"
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*"
]

[dependencies]
mnn-sys = { package = "rusto-mnn-sys", path = "../mnn-sys", version = "0.2.3" }
thiserror = "1.0"

[features]
default = ["prebuilt"]
prebuilt = ["mnn-sys/prebuilt"]
build-from-source = ["mnn-sys/build-from-source"]
# GPU/Accelerator backends
metal = ["mnn-sys/metal"]
coreml = ["mnn-sys/coreml"]
opencl = ["mnn-sys/opencl"]
vulkan = ["mnn-sys/vulkan"]
cuda = ["mnn-sys/cuda"]
# Mobile NPU backends
nnapi = ["mnn-sys/nnapi"]
hiai = ["mnn-sys/hiai"]
qnn = ["mnn-sys/qnn"]


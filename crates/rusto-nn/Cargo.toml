[package]
name = "rusto-nn"
version = "0.4.1"
edition = "2021"
description = "Lightweight, zero-bloat, 100% pure Rust inference engine for Alibaba MNN models"
license = "MIT OR Apache-2.0"
repository = "https://github.com/byrizki/rusto-rs"
keywords = ["mnn", "deep-learning", "inference", "pure-rust", "vision"]
categories = ["science", "computer-vision"]
exclude = ["tools/**"]

[dependencies]
thiserror = "1.0"
smallvec = { version = "1.13", features = ["union"] }
rten-onnx = { version = "0.27.0", optional = true }
rten-model-file = { version = "0.27.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
rten = { version = "0.27.0", features = ["rten_format"] }
rten-tensor = "0.27.0"

[features]
default = ["std", "parallel", "rten", "onnx"]
std = []
parallel = []
pool = ["parallel"]
rten = ["dep:rten-model-file"]
onnx = ["dep:rten-onnx"]

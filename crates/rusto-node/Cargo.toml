[package]
name = "rusto-node"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
rusto-rs = { package = "rusto-rs", path = "../..", default-features = false, features = ["rten"] }
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "json"] }

[build-dependencies]
napi-build = "2.1"

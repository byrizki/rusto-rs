[package]
name = "rusto-wasm"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusto-core = { path = "../rusto-core" }
rusto-nn = { path = "../rusto-nn", default-features = false, features = ["std", "onnx", "rten"], optional = true }
rusto-rten = { path = "../rusto-rten", optional = true }
rusto-nn-webgpu = { path = "../rusto-nn-webgpu", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "json"] }
console_error_panic_hook = "0.1.7"

[features]
default = ["rusto-nn", "onnx", "rten-format"]
rusto-nn = ["dep:rusto-nn"]
rusto-rten = ["dep:rusto-rten"]
rusto-webgpu = ["dep:rusto-nn", "dep:rusto-nn-webgpu"]
onnx = ["rusto-nn/onnx"]
rten-format = ["rusto-nn/rten"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features", "--strip-debug", "--strip-producers"]

[package]
name = "rusto-server"
version = "0.4.0"
edition = "2021"
description = "Mistral-compatible POST /v1/ocr HTTP server on top of rusto-rs (PP-OCRv6 models, per-request model choice)"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"
publish = false

[lib]
name = "rusto_http"
path = "src/lib.rs"

[[bin]]
name = "rusto-server"
path = "src/main.rs"

[dependencies]
rusto-rs = { path = "../..", features = ["rten"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
imagesize = "0.13"
ureq = "2"
# Same version and features as rusto-core, so the lockfile keeps one copy. Used to apply EXIF orientation.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[package.metadata.docs.rs]
all-features = true

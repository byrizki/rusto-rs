[package]
name = "rusto-core"
version = "0.3.2"
edition = "2021"
description = "Core pure-Rust computer vision algorithms, postprocessing, and types for RustO!"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"

[dependencies]
ndarray = "0.16"
thiserror = "1.0"
clipper2-rust = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.33"
dirs = "5.0"
rusto-nn = { path = "../rusto-nn", version = "0.3.2" }

[features]
default = []
use-opencv = []


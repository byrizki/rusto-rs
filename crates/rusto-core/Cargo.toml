[package]
name = "rusto-core"
version = "0.4.0"
edition = "2021"
description = "Core pure-Rust computer vision algorithms, postprocessing, and types for RustO!"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"

[dependencies]
ndarray = "0.16"
thiserror = "1.0"
clipper2-rust = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusto-nn = { path = "../rusto-nn", version = "0.4.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5.0"
rusto-nn = { path = "../rusto-nn", version = "0.4.0", features = ["rayon", "onnx", "rten"] }

[features]
default = []
use-opencv = []


[package]
name = "rusto-mnn-sys"
version = "0.1.4"
edition = "2021"
description = "Low-level FFI bindings to MNN library"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"
homepage = "https://github.com/byrizki/rusto-rs"
documentation = "https://docs.rs/rusto-mnn-sys"
readme = "README.md"
include = [
    "/src/**",
    "/include/**",
    "/mnn_wrapper.cpp",
    "/mnn_wrapper.h",
    "/wrapper.h",
    "/build.rs",
    "/Cargo.toml",
    "/README.md"
]

[dependencies]

[build-dependencies]
bindgen = "0.70"
cc = "1.0"
cmake = "0.1"
walkdir = "2.5.0"

[features]
default = ["prebuilt"]
prebuilt = []
build-from-source = []
metal = []
coreml = []
opencl = []
vulkan = []
cuda = []
nnapi = []
hiai = []
qnn = []


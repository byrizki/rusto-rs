[package]
name = "rusto-cpp"
version = "0.3.2"
edition = "2021"
description = "Native C++ and OpenCV accelerated computer vision backends for RustO!"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"

[dependencies]
rusto-core = { path = "../rusto-core", version = "0.3.2" }
opencv = { version = "0.97.2", optional = true }
clipper2-rust = { version = "1.2.0", optional = true }
ndarray = "0.16"
thiserror = "1.0"

[features]
default = []
opencv = ["dep:opencv", "dep:clipper2-rust"]


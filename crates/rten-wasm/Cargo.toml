[package]
name = "rusto-rten-wasm"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusto-core = { path = "../rusto-core" }
rusto-nn = { path = "../rusto-nn", default-features = false, features = ["std", "rten", "onnx"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

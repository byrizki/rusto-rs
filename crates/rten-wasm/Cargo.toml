[package]
name = "rusto-rten-wasm"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusto-core = { path = "../rusto-core" }
rusto-nn = { path = "../rusto-nn", default-features = false, features = ["std", "rten", "onnx"] }
rusto-rten = { path = "../rusto-rten", optional = true }
rusto-nn-webgpu = { path = "../rusto-nn-webgpu", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1.7"

[features]
default = ["rusto-nn"]
rusto-nn = []
rusto-rten = ["dep:rusto-rten"]
rusto-webgpu = ["dep:rusto-nn-webgpu"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]

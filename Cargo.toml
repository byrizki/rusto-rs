[workspace]
members = [".", "crates/rusto-core", "crates/rusto-cpp", "crates/rusto-nn", "crates/rusto-nn-webgpu", "crates/rusto-nn-cuda", "crates/rusto-rten", "crates/rusto-mnn", "crates/rten-wasm", "crates/rusto-node"]

[package]
name = "rusto-rs"
version = "0.4.0"
edition = "2021"
description = "RustO! - Pure Rust OCR library based on RapidOCR with PaddleOCR engine"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"
keywords = ["ocr", "paddle", "rten", "computer-vision", "text-recognition"]
categories = ["computer-vision", "text-processing"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/include/rusto.h",
    "/LICENSE*",
    "/CHANGELOG.md"
]

[lib]
name = "rusto"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
thiserror = "1.0"
clipper2-rust = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

# Pure Rust image processing (default)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.33"

# Optional OpenCV / C++ backend
opencv = { version = "0.97.2", optional = true }
rusto-cpp = { path = "crates/rusto-cpp", version = "0.4.0", optional = true }

# Pure Rust inference engines
rusto-core = { path = "crates/rusto-core", version = "0.4.0" }
rusto-nn = { path = "crates/rusto-nn", version = "0.4.0" }
rusto-rten = { path = "crates/rusto-rten", version = "0.4.0", optional = true }
rusto-nn-webgpu = { path = "crates/rusto-nn-webgpu", version = "0.4.0", optional = true }
rusto-nn-cuda = { path = "crates/rusto-nn-cuda", version = "0.4.0", optional = true }
rusto-mnn = { path = "crates/rusto-mnn", version = "0.4.0", optional = true }

# Model auto-download and caching
ureq = { version = "2.10", default-features = false, features = ["tls"] }
dirs = "5.0"

# UniFFI bindings
uniffi = { version = "0.31.0", default-features = false, optional = true }
cbindgen = { version = "0.28", default-features = false, optional = true }

[[bin]]
name = "rusto"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[[bin]]
name = "generate-c-headers"
path = "src/bin/generate-c-headers.rs"
required-features = ["cbindgen-cli"]

[dev-dependencies]
criterion = "0.5"

[features]
default = ["ffi", "rten"]
use-opencv = ["opencv", "dep:rusto-cpp", "rusto-cpp/opencv"]
uniffi = ["dep:uniffi", "uniffi/scaffolding-ffi-buffer-fns"]
uniffi-cli = ["uniffi", "uniffi/cli"]
cbindgen-cli = ["dep:cbindgen"]
ffi = ["uniffi"]  # Enable C FFI and UniFFI bindings
rten = ["dep:rusto-rten"]
mnn-cpp = ["dep:rusto-mnn"]
webgpu = ["dep:rusto-nn-webgpu"]

# Feature stubs for backwards compatibility
build-from-source = []
metal = []
coreml = []
opencl = []
vulkan = []
cuda = ["dep:rusto-nn-cuda"]
nnapi = []
hiai = []
qnn = []
 
[profile.dev]
# Faster dev builds
opt-level = 1
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
panic = "unwind"

# Fast compilation profile for testing
[profile.test]
opt-level = 1
debug = true
incremental = true


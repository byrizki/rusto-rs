[workspace]
members = [".", "crates/rten-wasm"]

[package]
name = "rusto-rs"
version = "0.2.5"
edition = "2021"
description = "RustO! - Pure Rust OCR library based on RapidOCR with PaddleOCR engine"
license = "MIT"
repository = "https://github.com/byrizki/rusto-rs"
keywords = ["ocr", "paddle", "rten", "computer-vision", "text-recognition"]
categories = ["computer-vision", "text-processing"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
    "/CHANGELOG.md"
]

[lib]
name = "rusto"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
thiserror = "1.0"
geo-clipper = "0.9"
geo-types = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

# Pure Rust image processing (default)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.33"

# Optional OpenCV backend
opencv = { version = "0.97.2", optional = true }

# Pure Rust inference engine
rten = { version = "0.27.0", features = ["onnx_format", "rten_format"] }
rten-tensor = "0.27.0"

# JNI bindings for Android
jni = { version = "0.21", optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = []
use-opencv = ["opencv"]
ffi = ["dep:jni"]  # Enable C FFI and JNI bindings

# Feature stubs for backwards compatibility
build-from-source = []
metal = []
coreml = []
opencl = []
vulkan = []
cuda = []
nnapi = []
hiai = []
qnn = []
 
[profile.dev]
# Faster dev builds
opt-level = 1
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# Fast compilation profile for testing
[profile.test]
opt-level = 1
debug = true
incremental = true

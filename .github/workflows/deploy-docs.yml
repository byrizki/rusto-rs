name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/web/**'
      - '.github/workflows/deploy-docs.yml'
  release:
    types: [published]
  workflow_run:
    workflows: ["Build & Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-prerequisites:
    name: Check rusto-web availability
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      has_rusto_web: ${{ steps.check.outputs.has_rusto_web }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      artifact_run_id: ${{ steps.check.outputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if rusto-web is available
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Check if WASM bindings exist locally in repo workspace
          if [ -f "packages/web/src/wasm/rusto_rten_wasm.js" ]; then
            echo "Found local WASM bindings in packages/web/src/wasm."
            echo "has_rusto_web=true" >> $GITHUB_OUTPUT
            echo "release_tag=local" >> $GITHUB_OUTPUT
            echo "artifact_run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          TARGET_TAG="v${VERSION}"
          echo "Checking GitHub Releases for target tag: ${TARGET_TAG}..."

          FOUND_TAG=""
          # Check exact target tag release
          if gh release view "$TARGET_TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q -E 'rusto-(web|wasm)'; then
            FOUND_TAG="$TARGET_TAG"
          else
            # Check recent published releases
            for tag in $(gh release list --limit 10 --json tagName,isDraft,isPrerelease -q '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' 2>/dev/null); do
              if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -q -E 'rusto-(web|wasm)'; then
                FOUND_TAG="$tag"
                break
              fi
            done
          fi

          if [ -n "$FOUND_TAG" ]; then
            echo "Found prebuilt rusto-web/wasm in GitHub release: ${FOUND_TAG}"
            echo "has_rusto_web=true" >> $GITHUB_OUTPUT
            echo "release_tag=${FOUND_TAG}" >> $GITHUB_OUTPUT
            echo "artifact_run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Check triggering workflow run or latest successful Build & Release run
          echo "Checking GitHub Actions workflow runs for rusto-wasm-package artifact..."
          CANDIDATE_RUN_ID="${{ github.event.workflow_run.id }}"
          if [ -z "$CANDIDATE_RUN_ID" ] || [ "$CANDIDATE_RUN_ID" = "null" ]; then
            CANDIDATE_RUN_ID=$(gh run list --workflow "Build & Release" --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          fi

          if [ -n "$CANDIDATE_RUN_ID" ] && [ "$CANDIDATE_RUN_ID" != "null" ]; then
            if gh run view "$CANDIDATE_RUN_ID" --json artifacts -q '.artifacts[].name' 2>/dev/null | grep -q 'rusto-wasm-package'; then
              echo "Found prebuilt rusto-wasm-package in workflow run: ${CANDIDATE_RUN_ID}"
              echo "has_rusto_web=true" >> $GITHUB_OUTPUT
              echo "release_tag=run" >> $GITHUB_OUTPUT
              echo "artifact_run_id=${CANDIDATE_RUN_ID}" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 4. Fallback: Build WASM on-the-fly during doc build
          echo "Prebuilt WASM artifact not found in releases or CI runs. Fallback to on-the-fly wasm build."
          echo "has_rusto_web=true" >> $GITHUB_OUTPUT
          echo "release_tag=build" >> $GITHUB_OUTPUT
          echo "artifact_run_id=" >> $GITHUB_OUTPUT

  build:
    name: Build Documentation
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.has_rusto_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (if building WASM)
        if: needs.check-prerequisites.outputs.release_tag == 'build'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Fetch WASM and Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-prerequisites.outputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ needs.check-prerequisites.outputs.artifact_run_id }}
        run: |
          mkdir -p /tmp/wasm-assets
          mkdir -p /tmp/model-assets
          mkdir -p ../packages/web/src/wasm
          mkdir -p public/wasm
          mkdir -p public/models/ppocrv6-tiny
          mkdir -p public/models/ppocrv6-tiny-int8
          mkdir -p public/models/ppocrv6-small
          mkdir -p public/models/ppocrv6-small-int8
          mkdir -p public/models/ppocrv6-medium
          mkdir -p public/models/ppocrv6-medium-int8
          mkdir -p public/models/ppocrv5-mobile
          mkdir -p public/models/ppocrv5-server
          mkdir -p public/models/ppocrv4-mobile
          mkdir -p public/models/ppocrv4-server

          # --- 1. Populate WASM bindings ---
          if [ "$RELEASE_TAG" = "build" ]; then
            echo "Building rten-wasm with wasm-pack on runner..."
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            (cd .. && wasm-pack build crates/rten-wasm --target web --out-dir packages/web/src/wasm)
          elif [ "$RELEASE_TAG" = "run" ] && [ -n "$ARTIFACT_RUN_ID" ]; then
            echo "Downloading prebuilt WASM from workflow run ${ARTIFACT_RUN_ID}..."
            gh run download "$ARTIFACT_RUN_ID" -n rusto-wasm-package --dir /tmp/wasm-assets || true
            if [ -f /tmp/wasm-assets/rusto-wasm.tar.gz ]; then
              tar -xzf /tmp/wasm-assets/rusto-wasm.tar.gz -C ../packages/web/src/wasm
            elif [ -f /tmp/wasm-assets/rusto-wasm.tgz ]; then
              tar -xzf /tmp/wasm-assets/rusto-wasm.tgz -C ../packages/web/src/wasm
            fi
          elif [ "$RELEASE_TAG" != "local" ] && [ -n "$RELEASE_TAG" ]; then
            echo "Downloading prebuilt WASM from release ${RELEASE_TAG}..."
            gh release download "$RELEASE_TAG" --pattern 'rusto-wasm.*' --pattern 'rusto-web-*.tgz' --dir /tmp/wasm-assets || true

            if [ -f /tmp/wasm-assets/rusto-wasm.tar.gz ]; then
              echo "Extracting rusto-wasm.tar.gz..."
              tar -xzf /tmp/wasm-assets/rusto-wasm.tar.gz -C ../packages/web/src/wasm
            elif [ -f /tmp/wasm-assets/rusto-wasm.tgz ]; then
              echo "Extracting rusto-wasm.tgz..."
              tar -xzf /tmp/wasm-assets/rusto-wasm.tgz -C ../packages/web/src/wasm
            elif ls /tmp/wasm-assets/rusto-web-*.tgz 1>/dev/null 2>&1; then
              echo "Extracting from rusto-web npm package tarball..."
              tar -xzf /tmp/wasm-assets/rusto-web-*.tgz -C /tmp/wasm-assets
              if [ -d /tmp/wasm-assets/package/src/wasm ]; then
                cp -r /tmp/wasm-assets/package/src/wasm/* ../packages/web/src/wasm/
              fi
            fi
          fi

          # --- 2. Populate Models ---
          MODELS_VERSION=$(cat ../MODELS_VERSION 2>/dev/null || echo "0.3.0")
          MODEL_TAG="models-rten-v${MODELS_VERSION}"
          echo "Attempting to download model assets from release ${MODEL_TAG}..."
          gh release download "$MODEL_TAG" --pattern 'RustO-Models-*.zip' --dir /tmp/model-assets 2>/dev/null || true

          if ! ls /tmp/model-assets/RustO-Models-*.zip 1>/dev/null 2>&1; then
            if [ "$RELEASE_TAG" != "local" ] && [ "$RELEASE_TAG" != "build" ] && [ "$RELEASE_TAG" != "run" ] && [ -n "$RELEASE_TAG" ]; then
              echo "Attempting to download model assets from library release ${RELEASE_TAG}..."
              gh release download "$RELEASE_TAG" --pattern 'RustO-Models-*.zip' --dir /tmp/model-assets 2>/dev/null || true
            fi
          fi

          if ! ls /tmp/model-assets/RustO-Models-*.zip 1>/dev/null 2>&1 && [ -n "$ARTIFACT_RUN_ID" ]; then
            echo "Attempting to download model assets from workflow run ${ARTIFACT_RUN_ID}..."
            gh run download "$ARTIFACT_RUN_ID" -n rusto-ios-model-resources --dir /tmp/model-assets 2>/dev/null || true
          fi

          for zip_file in /tmp/model-assets/RustO-Models-*.zip; do
            [ -f "$zip_file" ] || continue
            name=$(basename "$zip_file" .zip)
            case "$name" in
              RustO-Models-PPOCRv6-Tiny) target="ppocrv6-tiny" ;;
              RustO-Models-PPOCRv6-Tiny-INT8|RustO-Models-PPOCRv6-Tiny-int8) target="ppocrv6-tiny-int8" ;;
              RustO-Models-PPOCRv6-Small) target="ppocrv6-small" ;;
              RustO-Models-PPOCRv6-Small-INT8|RustO-Models-PPOCRv6-Small-int8) target="ppocrv6-small-int8" ;;
              RustO-Models-PPOCRv6-Medium) target="ppocrv6-medium" ;;
              RustO-Models-PPOCRv6-Medium-INT8|RustO-Models-PPOCRv6-Medium-int8) target="ppocrv6-medium-int8" ;;
              RustO-Models-PPOCRv5-Mobile) target="ppocrv5-mobile" ;;
              RustO-Models-PPOCRv5-Server) target="ppocrv5-server" ;;
              RustO-Models-PPOCRv4-Mobile) target="ppocrv4-mobile" ;;
              RustO-Models-PPOCRv4-Server) target="ppocrv4-server" ;;
              *) continue ;;
            esac
            echo "Extracting $zip_file to public/models/$target/..."
            unzip -o "$zip_file" -d "public/models/$target/"
          done

          # Fallback for models if not populated from release
          populate_model() {
            local target_id="$1"
            local local_dir="$2"
            local model_type="$3"
            local tier="$4"

            if [ ! -f "public/models/$target_id/det.onnx" ] && [ ! -f "public/models/$target_id/det.rten" ]; then
              if [ -d "$local_dir" ] && ([ -f "$local_dir/det.onnx" ] || [ -f "$local_dir/det.rten" ]); then
                echo "Copying local models from $local_dir to public/models/$target_id/..."
                cp -r "$local_dir"/* "public/models/$target_id/"
              else
                echo "Downloading $target_id via download_models.sh..."
                (cd .. && bash scripts/download_models.sh --model "$model_type" --tier "$tier" --output-dir "docs/public/models/$target_id") || true
              fi
            fi
          }

          populate_model "ppocrv6-tiny" "../models/PPOCR_v6_tiny" "ppocrv6" "tiny"
          populate_model "ppocrv6-small" "../models/PPOCR_v6_small" "ppocrv6" "small"
          populate_model "ppocrv6-medium" "../models/PPOCR_v6_medium" "ppocrv6" "medium"
          populate_model "ppocrv5-mobile" "../models/PPOCR_v5_mobile" "ppocrv5" "mobile"
          populate_model "ppocrv5-server" "../models/PPOCR_v5_server" "ppocrv5" "server"
          populate_model "ppocrv4-mobile" "../models/PPOCR_v4_mobile" "ppocrv4" "mobile"
          populate_model "ppocrv4-server" "../models/PPOCR_v4_server" "ppocrv4" "server"

          # Populate INT8 variants
          for tier in tiny small medium; do
            target_int8="ppocrv6-${tier}-int8"
            if [ ! -f "public/models/$target_int8/det.rten" ]; then
              if [ -d "../models/PPOCR_v6_${tier}_int8" ]; then
                echo "Copying local INT8 models to public/models/$target_int8/..."
                cp -r "../models/PPOCR_v6_${tier}_int8"/* "public/models/$target_int8/"
              elif [ -f "public/models/ppocrv6-${tier}/det.onnx" ] || [ -f "../models/PPOCR_v6_${tier}/det.onnx" ]; then
                echo "Quantizing PP-OCRv6 $tier to INT8..."
                python3 -m pip install onnxruntime || true
                python3 ../scripts/quantize_ppocrv6_int8.py --tier "$tier" --output-dir "public/models/$target_int8" || true
              fi
            fi
          done

          # Convert ONNX models to true .rten FlatBuffers format and clean up
          python3 -m pip install --break-system-packages rten-convert || pip install rten-convert || true

          for mdir in public/models/*; do
            [ -d "$mdir" ] || continue
            if [ -f "$mdir/det.onnx" ]; then
              rten-convert "$mdir/det.onnx" "$mdir/det.rten" || mv "$mdir/det.onnx" "$mdir/det.rten"
            fi
            if [ -f "$mdir/rec.onnx" ]; then
              rten-convert "$mdir/rec.onnx" "$mdir/rec.rten" || mv "$mdir/rec.onnx" "$mdir/rec.rten"
            fi
            rm -f "$mdir"/*.onnx
          done

          # Copy wasm runtime binary to public/wasm for live demo client asset serving
          if [ -f ../packages/web/src/wasm/rusto_rten_wasm_bg.wasm ]; then
            cp ../packages/web/src/wasm/rusto_rten_wasm_bg.wasm public/wasm/
          fi

          if [ ! -f ../packages/web/src/wasm/rusto_rten_wasm.js ]; then
            echo "::error::rusto_rten_wasm.js was not found in packages/web/src/wasm! Build cannot proceed."
            exit 1
          fi

          echo "WebAssembly bindings configured:"
          ls -la ../packages/web/src/wasm/

          echo "Configured public models for live demo:"
          ls -la public/models/

      - name: Build with Nuxt
        run: NUXT_APP_BASE_URL=/rusto-rs/ yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish OCR Models

on:
  push:
    tags:
      - "models-rten-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Model version to publish (leave empty to read from MODELS_VERSION)'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Model release tag (e.g. models-rten-v0.4.0). Leave empty to use tag from version'
        required: false
        type: string
        default: ''
      upload_to_huggingface:
        description: 'Publish models to Hugging Face Hub (byrizki/rusto-models)'
        type: boolean
        required: false
        default: true
      create_release:
        description: 'Create GitHub Release for OCR models'
        type: boolean
        required: false
        default: true
      draft:
        description: 'Create draft release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build-and-package-models:
    name: Build & Stage OCR Models
    runs-on: ubuntu-22.04

    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
      version: ${{ steps.release_info.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine model release tag and version
        id: release_info
        run: |
          MODELS_VER=$(cat MODELS_VERSION 2>/dev/null | tr -d '[:space:]')
          if [ -z "$MODELS_VER" ]; then
            MODELS_VER="0.4.0"
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#models-rten-v}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
            VERSION="${TAG#models-rten-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="models-rten-v${VERSION}"
          else
            VERSION="${MODELS_VER}"
            TAG="models-rten-v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using Tag: ${TAG}, Version: ${VERSION} (auto-read from MODELS_VERSION: ${MODELS_VER})"

      - name: Download, quantize, and convert OCR models
        run: |
          chmod +x scripts/download_models.sh
          chmod +x scripts/quantize_ppocrv6_int8.py
          python3 -m pip install --upgrade rten-convert onnx onnxruntime --break-system-packages || python3 -m pip install rten-convert onnx onnxruntime || true

          # 1. Download all models in source ONNX format
          bash scripts/download_models.sh --all

          # 2. Quantize PP-OCRv6 models to INT8 ONNX format
          python3 scripts/quantize_ppocrv6_int8.py --all --no-rten

          # 3. Convert all ONNX models to RTen format in parallel and clean up .onnx
          find models -name "*.onnx" | xargs -r -P 4 -I {} bash -c '
            onnx_path="{}"
            rten_path="${onnx_path%.onnx}.rten"
            echo "Converting $onnx_path -> $rten_path..."
            rten-convert "$onnx_path" "$rten_path" || python3 -c "import sys; from rten_convert.converter import main; sys.argv=[\"rten-convert\", sys.argv[1], sys.argv[2]]; sys.exit(main())" "$onnx_path" "$rten_path"
            rm -f "$onnx_path"
          '
          echo "✓ All models downloaded, quantized, and converted to .rten"

      - name: Stage Organized Model Release Files
        run: |
          chmod +x scripts/stage_model_releases.py
          python3 scripts/stage_model_releases.py \
            --models-dir models/ \
            --hf-dir model-releases-hf/ \
            --flat-dir model-releases-flat/ \
            --readme scripts/huggingface-models-readme.md

      - name: Upload HF Models Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-models-hf
          path: model-releases-hf/

      - name: Upload Flat Models Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-models-flat
          path: model-releases-flat/

  publish-to-huggingface:
    name: Publish to Hugging Face Hub
    needs: [build-and-package-models]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.upload_to_huggingface != false
    steps:
      - uses: actions/checkout@v4

      - name: Download Hugging Face Model Files
        uses: actions/download-artifact@v4
        with:
          name: rusto-models-hf
          path: model-releases-hf

      - name: Install Hugging Face Hub CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Upload models to Hugging Face Hub (byrizki/rusto-models)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload byrizki/rusto-models model-releases-hf/ . \
            --delete "*" \
            --commit-message "Release RustO OCR models ${{ needs.build-and-package-models.outputs.tag }}" \
            --commit-description "Automated model release from rusto-rs CI (${{ github.sha }})"

  create-release:
    name: Create GitHub Release
    needs: [build-and-package-models]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.create_release == true || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Flat Model Release Files
        uses: actions/download-artifact@v4
        with:
          name: rusto-models-flat
          path: model-releases-flat

      - name: Create GitHub Release for OCR Models
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-package-models.outputs.tag }}
          name: RustO! OCR Models ${{ needs.build-and-package-models.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: model-releases-flat/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || contains(needs.build-and-package-models.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ## RustO! Pre-trained OCR Models ${{ needs.build-and-package-models.outputs.tag }}

            Standalone pre-trained models converted to pure-Rust RTen format.
            Also available on Hugging Face Hub: [byrizki/rusto-models](https://huggingface.co/byrizki/rusto-models) with native CORS support.

            ### Base OCR Pipelines (Detection + Recognition + Dictionary)
            - **Indra OCR (Default Flagship)**: `indra_det.rten`, `indra_rec.rten`, `indra_meta.json`
            - **PP-OCRv6 Tiny**: `ppocrv6_tiny_det.rten`, `ppocrv6_tiny_rec.rten`, `ppocrv6_dict.txt`
            - **PP-OCRv6 Tiny INT8**: `ppocrv6_tiny_int8_det.rten`, `ppocrv6_tiny_int8_rec.rten`
            - **PP-OCRv6 Small**: `ppocrv6_small_det.rten`, `ppocrv6_small_rec.rten`
            - **PP-OCRv6 Small INT8**: `ppocrv6_small_int8_det.rten`, `ppocrv6_small_int8_rec.rten`
            - **PP-OCRv6 Medium**: `ppocrv6_medium_det.rten`, `ppocrv6_medium_rec.rten`
            - **PP-OCRv6 Medium INT8**: `ppocrv6_medium_int8_det.rten`, `ppocrv6_medium_int8_rec.rten`
            - **PP-OCRv5 Mobile**: `ppocrv5_mobile_det.rten`, `ppocrv5_mobile_rec.rten`, `ppocrv5_dict.txt`
            - **PP-OCRv5 Server**: `ppocrv5_server_det.rten`, `ppocrv5_server_rec.rten`
            - **PP-OCRv4 Mobile**: `ppocrv4_mobile_det.rten`, `ppocrv4_mobile_rec.rten`, `ppocrv4_dict.txt`
            - **PP-OCRv4 Server**: `ppocrv4_server_det.rten`, `ppocrv4_server_rec.rten`

            ### Multilingual Recognition Models & Dictionaries
            - **Arabic**: `ppocrv5_rec_arabic.rten`, `ppocrv5_dict_arabic.txt`
            - **Cyrillic**: `ppocrv5_rec_cyrillic.rten`, `ppocrv5_dict_cyrillic.txt`
            - **Devanagari (Hindi)**: `ppocrv5_rec_devanagari.rten`, `ppocrv5_dict_devanagari.txt`
            - **Greek**: `ppocrv5_rec_el.rten`, `ppocrv5_dict_el.txt`
            - **East Slavic**: `ppocrv5_rec_eslav.rten`, `ppocrv5_dict_eslav.txt`
            - **Korean**: `ppocrv5_rec_korean.rten`, `ppocrv5_dict_korean.txt`
            - **Latin**: `ppocrv5_rec_latin.rten`, `ppocrv5_dict_latin.txt`
            - **Tamil**: `ppocrv5_rec_ta.rten`, `ppocrv5_dict_ta.txt`
            - **Telugu**: `ppocrv5_rec_te.rten`, `ppocrv5_dict_te.txt`
            - **Thai**: `ppocrv5_rec_th.rten`, `ppocrv5_dict_th.txt`
            - **Japanese**: `ppocrv4_rec_japan.rten`, `ppocrv4_dict_japan.txt`
            - **Traditional Chinese**: `ppocrv4_rec_chinese_cht.rten`, `ppocrv4_dict_chinese_cht.txt`
            - **Kannada**: `ppocrv4_rec_kannada.rten`, `ppocrv4_dict_kannada.txt`

            ### Pluggable Modular Extras
            - **Text-Line Orientation Classifier**: `ppocr_cls.rten`
            - **Document Orientation Classifier**: `ppocr_orient.rten`
            - **Document Dewarping (UVDoc)**: `uvdoc.rten`
            - **Layout Analysis (CDLA 10-Class)**: `layout_cdla.rten`
            - **Layout Analysis (PubLayNet 5-Class)**: `layout_publaynet.rten`

            ### Indra Modular Extras
            - **Neural Reading Order**: `indra_order.rten`
            - **Document Orientation**: `indra_orient.rten`
            - **CJK Recognition**: `indra_rec_cjk.rten`
            - **RTL Recognition**: `indra_rec_rtl.rten`
            - **World Recognition**: `indra_rec_world.rten`
            - **Script Detection**: `indra_script.rten`
            - **Math Formula Classifier**: `indra_mathcls.rten`
            - **Math Formula Recognition**: `indra_math_enc.rten`, `indra_math_dec_init.rten`, `indra_math_dec_step.rten`, `indra_math_meta.json`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

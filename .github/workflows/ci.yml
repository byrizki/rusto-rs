name: Library CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target tag to build and validate (leave empty to use version from Cargo.toml)'
        required: false
        type: string
        default: ''

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  library-checks:
    name: Rust Workspace Tests & Manifest Consistency
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare test model fixtures
        run: |
          chmod +x scripts/download_models.sh
          python3 -m pip install --upgrade rten-convert --break-system-packages || python3 -m pip install rten-convert || true
          bash scripts/download_models.sh --model ppocrv6 --tier tiny --convert-rten

      - name: Run Cargo Tests (Workspace)
        run: cargo test --workspace

      - name: Verify Version Consistency (Dry Run)
        run: |
          python3 scripts/bump_version.py --dry-run patch

  build:
    name: Multi-Platform Build & Consumer Validation
    needs: [library-checks]
    uses: ./.github/workflows/build.yml
    with:
      tag_name: ${{ inputs.tag_name || '' }}
      run-release: false
    secrets: inherit

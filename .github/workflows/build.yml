name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build iOS Rust Libraries (Parallel Matrix)
  build-ios-libs:
    name: Build iOS Lib - ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup environment
        run: |
          echo "Building MNN from source"
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Build for iOS target
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.target }}/release/build -type f -name "libMNN.a" | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.target }}
          path: mnn-static-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload iOS target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/librusto.a

  # Package iOS XCFramework
  build-ios:
    name: Build RustO iOS XCFramework
    needs: [build-ios-libs]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-ios-*
          path: artifacts/ios

      - name: Create XCFramework
        run: |
          mkdir -p build/ios-device build/ios-simulator

          cp artifacts/ios/rusto-ios-aarch64-apple-ios/librusto.a build/ios-device/

          lipo -create \
            artifacts/ios/rusto-ios-aarch64-apple-ios-sim/librusto.a \
            artifacts/ios/rusto-ios-x86_64-apple-ios/librusto.a \
            -output build/ios-simulator/librusto.a

          xcodebuild -create-xcframework \
            -library build/ios-device/librusto.a \
            -library build/ios-simulator/librusto.a \
            -output build/RustO.xcframework

          echo "Copying Swift sources..."
          mkdir -p build/src
          cp -r packages/ios/src/* build/src/
          
          echo "Copying LICENSE..."
          cp LICENSE build/

          cd build
          zip -r RustO.xcframework.zip RustO.xcframework src LICENSE
          cd ..

      - name: Package iOS Model Bundles
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

          package_model_zip() {
            local model_src="$1"
            local zip_name="$2"
            local tmp_dir="build/tmp_$zip_name"
            mkdir -p "$tmp_dir"
            cp -r "$model_src"/* "$tmp_dir/"
            (cd "$tmp_dir" && zip -r "../../build/$zip_name.zip" .)
            rm -rf "$tmp_dir"
          }

          package_model_zip "models/PPOCR_v6_tiny" "RustO-Models-PPOCRv6-Tiny"
          package_model_zip "models/PPOCR_v6_small" "RustO-Models-PPOCRv6-Small"
          package_model_zip "models/PPOCR_v6_medium" "RustO-Models-PPOCRv6-Medium"
          package_model_zip "models/PPOCR_v5_mobile" "RustO-Models-PPOCRv5-Mobile"
          package_model_zip "models/PPOCR_v5_server" "RustO-Models-PPOCRv5-Server"
          package_model_zip "models/PPOCR_v4_mobile" "RustO-Models-PPOCRv4-Mobile"
          package_model_zip "models/PPOCR_v4_server" "RustO-Models-PPOCRv4-Server"

          package_model_zip "models/PPOCR_v5_arabic" "RustO-Models-PPOCRv5-Arabic"
          package_model_zip "models/PPOCR_v5_cyrillic" "RustO-Models-PPOCRv5-Cyrillic"
          package_model_zip "models/PPOCR_v5_devanagari" "RustO-Models-PPOCRv5-Devanagari"
          package_model_zip "models/PPOCR_v5_el" "RustO-Models-PPOCRv5-Greek"
          package_model_zip "models/PPOCR_v5_eslav" "RustO-Models-PPOCRv5-EastSlavic"
          package_model_zip "models/PPOCR_v5_korean" "RustO-Models-PPOCRv5-Korean"
          package_model_zip "models/PPOCR_v5_latin" "RustO-Models-PPOCRv5-Latin"
          package_model_zip "models/PPOCR_v5_ta" "RustO-Models-PPOCRv5-Tamil"
          package_model_zip "models/PPOCR_v5_te" "RustO-Models-PPOCRv5-Telugu"
          package_model_zip "models/PPOCR_v5_th" "RustO-Models-PPOCRv5-Thai"

          package_model_zip "models/PPOCR_v4_japan" "RustO-Models-PPOCRv4-Japanese"
          package_model_zip "models/PPOCR_v4_chinese_cht" "RustO-Models-PPOCRv4-TraditionalChinese"
          package_model_zip "models/PPOCR_v4_kannada" "RustO-Models-PPOCRv4-Kannada"

      - name: Upload core XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-core-xcframework
          path: build/RustO.xcframework.zip

      - name: Upload each iOS model resource artifact
        run: |
          set -euo pipefail
          for model_zip in build/RustO-Models-*.zip; do
            test -f "$model_zip"
            model_id="$(basename "$model_zip" .zip | sed 's/^RustO-Models-//' | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
            mkdir -p "artifacts/ios-models/$model_id"
            cp "$model_zip" "artifacts/ios-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-model-resources
          path: artifacts/ios-models/

  # Build Android Rust Libraries (Parallel Matrix)
  build-android-libs:
    name: Build Android Lib - ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android target
        env:
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CC_i686_linux_android: i686-linux-android21-clang
          CXX_i686_linux_android: i686-linux-android21-clang++
          AR_i686_linux_android: llvm-ar
          CC_x86_64_linux_android: x86_64-linux-android21-clang
          CXX_x86_64_linux_android: x86_64-linux-android21-clang++
          AR_x86_64_linux_android: llvm-ar
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.target }}/release/build -type f -name "libMNN.a" | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.target }}
          path: mnn-static-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload Android target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/librusto.so

  # Package Android AAR
  build-android:
    name: Build RustO Android AAR
    needs: [build-android-libs]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all OCR models
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Android Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-android-*
          path: artifacts/android

      - name: Copy libraries and assets
        run: |
          mkdir -p packages/android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp artifacts/android/rusto-android-arm64-v8a/librusto.so packages/android/src/main/jniLibs/arm64-v8a/
          cp artifacts/android/rusto-android-armeabi-v7a/librusto.so packages/android/src/main/jniLibs/armeabi-v7a/
          cp artifacts/android/rusto-android-x86/librusto.so packages/android/src/main/jniLibs/x86/
          cp artifacts/android/rusto-android-x86_64/librusto.so packages/android/src/main/jniLibs/x86_64/

          # Copy models into each Android model submodule
          # PPOCR_v6_tiny -> lowercase -> sed ppocr_v -> ppocrv -> tr _ - -> ppocrv6-tiny
          for model_dir in models/PPOCR_*; do
            if [ -d "$model_dir" ]; then
              base_name=$(basename "$model_dir" | tr '[:upper:]' '[:lower:]' | sed 's/ppocr_v/ppocrv/' | tr '_' '-')
              pkg_dir="packages/android/models/rusto-models-$base_name"
              if [ -d "$pkg_dir" ]; then
                mkdir -p "$pkg_dir/src/main/assets"
                cp -r "$model_dir"/* "$pkg_dir/src/main/assets/"
                echo "Copied $model_dir -> $pkg_dir/src/main/assets/"
              else
                echo "Warning: No Android package found for $model_dir (tried $pkg_dir)"
              fi
            fi
          done

      - name: Make Gradle Wrapper executable
        working-directory: packages/android
        run: chmod +x gradlew || true

      - name: Build AARs
        working-directory: packages/android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Separate Android core and model AAR artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-core artifacts/android-models
          find packages/android/build/outputs/aar -name '*-release.aar' -exec cp {} artifacts/android-core/ \;
          test "$(find artifacts/android-core -name '*.aar' | wc -l | tr -d ' ')" = 1
          for aar in packages/android/models/*/build/outputs/aar/*-release.aar; do
            test -f "$aar"
            model_id="$(basename "$aar" | sed -E 's/^rusto-models-//; s/-release\.aar$//')"
            mkdir -p "artifacts/android-models/$model_id"
            cp "$aar" "artifacts/android-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-android-core-aar
          path: artifacts/android-core/
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-android-model-aars
          path: artifacts/android-models/

  # Build .NET NuGet package
  build-dotnet:
    name: Build .NET NuGet - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            runner: ubuntu-22.04
            lib: librusto.so
            rust_target: x86_64-unknown-linux-gnu
          - os: macos
            arch: x64
            target: osx-x64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            target: osx-arm64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: x64
            target: win-x64
            runner: windows-2022
            lib: rusto.dll
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build for target
        shell: bash
        run: cargo build --release --target ${{ matrix.rust_target }} --features ffi

      - name: Copy native library
        shell: bash
        run: |
          mkdir -p packages/dotnet/runtimes/${{ matrix.target }}/native
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} \
             packages/dotnet/runtimes/${{ matrix.target }}/native/

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.rust_target }}/release/build -type f \( -name "libMNN.a" -o -name "MNN.lib" \) | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.rust_target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.rust_target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.rust_target }}
          path: mnn-static-${{ matrix.rust_target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-${{ matrix.target }}
          path: packages/dotnet/runtimes/${{ matrix.target }}/**/*

  # Package .NET NuGet
  package-dotnet:
    name: Package .NET NuGet
    needs: [build-dotnet]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download all .NET artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-dotnet-*
          path: artifacts

      - name: Merge runtime artifacts
        run: |
          mkdir -p packages/dotnet/runtimes
          for dir in artifacts/rusto-dotnet-*; do
            target=$(basename "$dir" | sed 's/rusto-dotnet-//')
            echo "Processing artifact: $dir (target: $target)"
            src="$dir/packages/dotnet/runtimes/$target/native"
            if [ -d "$src" ]; then
              mkdir -p "packages/dotnet/runtimes/$target/native"
              cp -rv "$src"/. "packages/dotnet/runtimes/$target/native/"
              echo "Copied native files for $target"
            else
              echo "Warning: native dir not found at $src"
            fi
          done

      - name: Download all OCR models
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

      - name: Prepare model packages
        run: |
          echo "=== Copying model files to model NuGet packages ==="
          for proj_dir in packages/dotnet/models/*; do
            if [ -d "$proj_dir" ]; then
              proj_name=$(basename "$proj_dir")
              # Map NuGet project name to model folder name
              # e.g., RustODotnet.Models.PPOCRv5.Arabic -> models/PPOCR_v5_arabic
              # e.g., RustODotnet.Models.PPOCRv5.Greek -> models/PPOCR_v5_el
              # e.g., RustODotnet.Models.PPOCRv5.EastSlavic -> models/PPOCR_v5_eslav
              model_name=$(echo "$proj_name" | sed 's/RustODotnet.Models.//' | sed 's/\./_/g' | tr '[:upper:]' '[:lower:]' \
                | sed 's/ppocrv/PPOCR_v/' \
                | sed 's/greek/el/' | sed 's/eastslavic/eslav/' | sed 's/tamil/ta/' | sed 's/telugu/te/' | sed 's/thai/th/' \
                | sed 's/japanese/japan/' | sed 's/traditionalchinese/chinese_cht/')
              
              if [ -d "models/$model_name" ]; then
                mkdir -p "$proj_dir/models"
                cp -r "models/$model_name"/* "$proj_dir/models/"
                echo "Copied models/$model_name -> $proj_dir/models/"
              else
                echo "Warning: models/$model_name not found for $proj_name"
              fi
            fi
          done

      - name: Build and Pack NuGet Packages
        run: |
          mkdir -p nupkg
          
          echo "=== Packing Core Runtime ==="
          cd packages/dotnet
          dotnet build RustODotnet.csproj -c Release
          dotnet pack RustODotnet.csproj -c Release -o ../../nupkg -v detailed
          cd ../..

          echo "=== Packing Model Packages ==="
          for proj in packages/dotnet/models/*/*.csproj; do
            if [ -f "$proj" ]; then
              echo "Packing $proj..."
              dotnet pack "$proj" -c Release -o nupkg -v detailed
            fi
          done

          printf '\n=== Generated Packages ===\n'
          ls -lh nupkg/*.nupkg

      - name: Separate .NET core and model NuGet artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/dotnet-core artifacts/dotnet-models
          core="$(find nupkg -maxdepth 1 -name 'RustODotnet.[0-9]*.nupkg' -print -quit)"
          test -n "$core"
          cp "$core" artifacts/dotnet-core/
          for nupkg in nupkg/RustODotnet.Models.*.nupkg; do
            test -f "$nupkg"
            model_id="$(basename "$nupkg" | sed -E 's/^RustODotnet\.Models\.//; s/\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg$//' | tr '[:upper:]' '[:lower:]' | tr '.' '-')"
            mkdir -p "artifacts/dotnet-models/$model_id"
            cp "$nupkg" "artifacts/dotnet-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-core-nupkg
          path: artifacts/dotnet-core/
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-model-nupkgs
          path: artifacts/dotnet-models/

  # package React Native
  package-react-native:
    name: Package React Native
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Yarn Classic
        run: yarn --version

      - name: Install React Native package build dependencies
        working-directory: packages/react-native
        run: yarn install --ignore-scripts --non-interactive

      - name: Build and pack NPM package
        working-directory: packages/react-native
        run: |
          yarn prepare
          yarn pack --filename ../react-native-rusto.tgz

      - name: Upload NPM package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-native-package
          path: packages/react-native-rusto.tgz

  # Create GitHub Release
  binding-examples:
    name: Validate release binding consumer apps
    needs: [build-ios, build-android, package-dotnet, package-react-native]
    uses: ./.github/workflows/binding-example-ci.yml
    with:
      release-artifact-validation: true

  release:
    name: Create GitHub Release
    needs: [binding-examples, build-ios, build-android, package-dotnet, package-react-native]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          for dir in rusto-x86_64-* rusto-aarch64-* rusto-android-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              tar czf "../../releases/${dir}.tar.gz" *
              cd ..
            fi
          done

          if [ -d "rusto-ios-core-xcframework" ]; then
            find rusto-ios-core-xcframework -name 'RustO.xcframework.zip' -exec cp {} ../releases/ \;
          fi
          if [ -d "rusto-ios-model-resources" ]; then
            find rusto-ios-model-resources -name 'RustO-Models-*.zip' -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-android-core-aar" ]; then
            find rusto-android-core-aar -name "*.aar" -exec cp {} ../releases/ \;
          fi
          if [ -d "rusto-android-model-aars" ]; then
            find rusto-android-model-aars -name "*.aar" -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-dotnet-core-nupkg" ]; then
            find rusto-dotnet-core-nupkg -name 'RustODotnet.*.nupkg' -exec cp {} ../releases/ \;
          fi
          if [ -d "rusto-dotnet-model-nupkgs" ]; then
            find rusto-dotnet-model-nupkgs -name 'RustODotnet.Models.*.nupkg' -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-react-native-package" ]; then
             cp rusto-react-native-package/*.tgz ../releases/ || true
          fi

          for f in mnn-static-*/*.tar.gz; do
            if [ -f "$f" ]; then
              cp "$f" ../releases/ || true
            fi
          done

      - name: Generate checksums
        working-directory: releases
        run: |
          sha256sum * > SHA256SUMS || true

      - name: Determine release tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: RustO! Release ${{ steps.release_info.outputs.tag }}
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RustO! Release ${{ steps.release_info.outputs.tag }}

            ### Highlights
            - Pure Rust OCR library powered by PaddleOCR models
            - Uses MNN inference engine for optimal performance
            - Cross-platform support (Linux, macOS, Windows, iOS, Android, .NET)
            - Includes bundled model files and dictionary files

            ### Platform Support
            - **Linux**: x64, ARM64
            - **macOS**: x64 (Intel), ARM64 (Apple Silicon)
            - **Windows**: x64
            - **iOS**: Universal XCFramework (device + simulator)
            - **Android**: AAR with all architectures (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **.NET**: NuGet package with native libraries for all desktop platforms
            - **React Native**: NPM package with bundled binaries

            ### Installation
            Download the appropriate package for your platform and extract it.
            See SHA256SUMS for file verification.

            ### Inference Engine
            - Uses MNN (Mobile Neural Network) for efficient inference
            - Includes pre-converted PaddleOCR models in MNN format
            - Supports multiple languages via included dictionary files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

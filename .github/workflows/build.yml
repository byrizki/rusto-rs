name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string
        default: ''
      run-release:
        description: 'Whether to create a GitHub Release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build iOS Rust Libraries (Parallel Matrix)
  build-ios-libs:
    name: Build iOS Lib - ${{ matrix.target }}
    # Keep artifact object format/toolchain compatible with RN consumer build.
    # macos-latest advanced to Xcode 26 while examples use macos-15/Xcode 16.
    runs-on: macos-15
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup environment
        run: |
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Build for iOS target
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Upload iOS target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/librusto.a

  # Package iOS XCFramework
  build-ios:
    name: Build RustO iOS XCFramework
    needs: [build-ios-libs]
    # Package with same Xcode generation as build-ios-libs and CI consumers.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-ios-*
          path: artifacts/ios

      - name: Create XCFramework
        run: |
          mkdir -p build/ios-device build/ios-simulator

          # `RustO` pod compiles Swift bridge into libRustO.a. APFS is normally
          # case-insensitive, so core librusto.a collides with that output when
          # CocoaPods passes -lrusto. Use distinct core name in XCFramework.
          cp artifacts/ios/rusto-ios-aarch64-apple-ios/librusto.a \
            build/ios-device/libRustoCore.a

          lipo -create \
            artifacts/ios/rusto-ios-aarch64-apple-ios-sim/librusto.a \
            artifacts/ios/rusto-ios-x86_64-apple-ios/librusto.a \
            -output build/ios-simulator/libRustoCore.a

          xcodebuild -create-xcframework \
            -library build/ios-device/libRustoCore.a \
            -library build/ios-simulator/libRustoCore.a \
            -output build/RustO.xcframework

          # Package XCFramework along with Swift sources and LICENSE required by CocoaPods
          cp -r packages/ios/src build/
          cp packages/ios/LICENSE build/
          (cd build && zip -r RustO.xcframework.zip RustO.xcframework src LICENSE)

      - name: Verify XCFramework exports canonical FFI ABI
        run: |
          set -euo pipefail
          archives=(build/RustO.xcframework/*/*.a)
          test "${#archives[@]}" -eq 2
          for archive in "${archives[@]}"; do
            test -f "$archive"
            echo "Checking $archive"
            symbols="$(strings "$archive")"
            for symbol in \
              rocr_initialize rocr_detect_text_file rocr_detect_text_data \
              rocr_detect_text_file_spatial rocr_detect_text_data_spatial \
              rocr_free_results rocr_free_string rocr_free rocr_version; do
              grep -Fxq "_$symbol" <<<"$symbols"
            done
          done

      - name: Upload core XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-core-xcframework
          path: build/RustO.xcframework.zip

  # Build Android Rust Libraries (Parallel Matrix)
  build-android-libs:
    name: Build Android Lib - ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android target
        env:
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CC_i686_linux_android: i686-linux-android21-clang
          CXX_i686_linux_android: i686-linux-android21-clang++
          AR_i686_linux_android: llvm-ar
          CC_x86_64_linux_android: x86_64-linux-android21-clang
          CXX_x86_64_linux_android: x86_64-linux-android21-clang++
          AR_x86_64_linux_android: llvm-ar
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Upload Android target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/librusto.so

  # Package Android AAR
  build-android:
    name: Build RustO Android AAR
    needs: [build-android-libs]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download PP-OCRv6 Tiny model for test fixture
        run: |
          chmod +x scripts/download_models.sh
          python3 -m pip install --upgrade rten-convert --break-system-packages || python3 -m pip install rten-convert || true
          bash scripts/download_models.sh --model ppocrv6 --tier tiny --convert-rten

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Android Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-android-*
          path: artifacts/android

      - name: Copy libraries and assets
        run: |
          mkdir -p packages/android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp artifacts/android/rusto-android-arm64-v8a/librusto.so packages/android/src/main/jniLibs/arm64-v8a/
          cp artifacts/android/rusto-android-armeabi-v7a/librusto.so packages/android/src/main/jniLibs/armeabi-v7a/
          cp artifacts/android/rusto-android-x86/librusto.so packages/android/src/main/jniLibs/x86/
          cp artifacts/android/rusto-android-x86_64/librusto.so packages/android/src/main/jniLibs/x86_64/

      - name: Make Gradle Wrapper executable
        working-directory: packages/android
        run: chmod +x gradlew || true

      - name: Build AARs
        working-directory: packages/android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Stage Android core AAR artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-core
          find packages/android/build/outputs/aar -name '*-release.aar' -exec cp {} artifacts/android-core/ \;
          test "$(find artifacts/android-core -name '*.aar' | wc -l | tr -d ' ')" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-android-core-aar
          path: artifacts/android-core/

  # Build .NET NuGet package
  build-dotnet:
    name: Build .NET NuGet - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            runner: ubuntu-22.04
            lib: librusto.so
            rust_target: x86_64-unknown-linux-gnu
          - os: macos
            arch: x64
            target: osx-x64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            target: osx-arm64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: x64
            target: win-x64
            runner: windows-2022
            lib: rusto.dll
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build for target
        shell: bash
        run: cargo build --release --target ${{ matrix.rust_target }} --features ffi

      - name: Copy native library
        shell: bash
        run: |
          mkdir -p packages/dotnet/runtimes/${{ matrix.target }}/native
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} \
             packages/dotnet/runtimes/${{ matrix.target }}/native/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-${{ matrix.target }}
          path: packages/dotnet/runtimes/${{ matrix.target }}/**/*

  # Package .NET NuGet
  package-dotnet:
    name: Package .NET NuGet
    needs: [build-dotnet]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download all .NET artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-dotnet-*
          path: artifacts

      - name: Merge runtime artifacts
        run: |
          mkdir -p packages/dotnet/runtimes
          for dir in artifacts/rusto-dotnet-*; do
            target=$(basename "$dir" | sed 's/rusto-dotnet-//')
            echo "Processing artifact: $dir (target: $target)"
            src="$dir/packages/dotnet/runtimes/$target/native"
            if [ -d "$src" ]; then
              mkdir -p "packages/dotnet/runtimes/$target/native"
              cp -rv "$src"/. "packages/dotnet/runtimes/$target/native/"
              echo "Copied native files for $target"
            else
              echo "Warning: native dir not found at $src"
            fi
          done

      - name: Build and Pack NuGet Packages
        run: |
          mkdir -p nupkg
          
          echo "=== Packing Core Runtime ==="
          cd packages/dotnet
          dotnet build RustODotnet.csproj -c Release
          dotnet pack RustODotnet.csproj -c Release -o ../../nupkg -v detailed
          cd ../..

          printf '\n=== Generated Packages ===\n'
          ls -lh nupkg/*.nupkg

      - name: Stage .NET core NuGet artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/dotnet-core
          core="$(find nupkg -maxdepth 1 -name 'RustODotnet.[0-9]*.nupkg' -print -quit)"
          test -n "$core"
          cp "$core" artifacts/dotnet-core/
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-core-nupkg
          path: artifacts/dotnet-core/

  # Package Multi-Platform Language Packages (NPM, Python, Java, Dart, Flutter, Go)
  package-react-native:
    name: Package Language Bindings & Distribution Packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify Yarn Classic
        run: yarn --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build rten-wasm
        run: |
          wasm-pack build crates/rten-wasm --target web --out-dir ../../packages/web/src/wasm
          rm -f packages/web/src/wasm/.gitignore
          mkdir -p artifacts/wasm
          tar czf artifacts/wasm/rusto-wasm.tar.gz -C packages/web/src/wasm --exclude='.gitignore' .
          cp artifacts/wasm/rusto-wasm.tar.gz artifacts/wasm/rusto-wasm.tgz

      - name: Build host Rust libraries and N-API addon
        run: |
          cargo build --release --features ffi
          cargo build --release -p rusto-node

      - name: Clean stale packages
        run: |
          rm -f packages/*.tgz packages/*.tar.gz packages/*.zip packages/*.whl packages/node/rusto.node packages/python/rusto/generated/librusto.so

      - name: Build and pack @rustors/web
        working-directory: packages/web
        run: |
          npm install
          npm run build
          npm pack --pack-destination ..

      - name: Build and pack @rustors/react
        working-directory: packages/react
        run: |
          npm install
          npm run build
          npm pack --pack-destination ..

      - name: Build, test, and pack @rustors/node
        working-directory: packages/node
        run: |
          cp ../../target/release/librusto_node.so rusto.node
          npm test
          npm pack --pack-destination ..
          rm -f rusto.node

      - name: Build, test, and pack Python package
        working-directory: packages/python
        run: |
          cp ../../target/release/librusto.so rusto/generated/librusto.so
          python3 -m unittest discover -s tests
          pip install --upgrade build wheel
          python3 -m build -o ../../packages/python-dist
          rm -f rusto/generated/librusto.so

      - name: Install React Native package build dependencies
        working-directory: packages/react-native
        run: yarn install --ignore-scripts --non-interactive

      - name: Build and pack React Native package
        working-directory: packages/react-native
        run: |
          yarn prepare
          yarn pack --filename ../rustors-react-native.tgz

      - name: Upload React Native package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-native-package
          path: packages/rustors-react-native.tgz

      - name: Upload @rustors/web package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-web-package
          path: packages/rustors-web-*.tgz

      - name: Upload @rustors/react package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-package
          path: packages/rustors-react-*.tgz

      - name: Upload @rustors/node package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-node-package
          path: packages/rustors-node-*.tgz

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-python-package
          path: packages/python-dist/*

      - name: Upload rusto-wasm package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-wasm-package
          path: |
            artifacts/wasm/rusto-wasm.tar.gz
            artifacts/wasm/rusto-wasm.tgz

      - name: Build, test, and pack Java package
        working-directory: packages/java
        run: |
          chmod +x gradlew || true
          ./gradlew test
          ./gradlew jar
          mkdir -p ../../packages/java-dist
          cp build/libs/*.jar ../../packages/java-dist/

      - name: Upload Java package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-java-package
          path: packages/java-dist/*.jar

      - name: Test and pack Dart package
        working-directory: packages/dart
        run: |
          dart pub get
          dart analyze
          dart test
          tar -czf ../rusto-dart.tar.gz --exclude='.git*' --exclude='build' .

      - name: Upload Dart package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dart-package
          path: packages/rusto-dart.tar.gz

      - name: Test and pack Flutter package
        working-directory: packages/flutter
        run: |
          flutter pub get
          flutter analyze
          tar -czf ../rusto-flutter.tar.gz --exclude='.git*' --exclude='build' --exclude='example' .

      - name: Upload Flutter package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-flutter-package
          path: packages/rusto-flutter.tar.gz

      - name: Test and pack Go module package
        working-directory: packages/go
        run: |
          go test -v ./...
          cd ..
          zip -r rusto-go.zip go/ -x "*/.git*" -x "*/target/*"

      - name: Upload Go package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-go-package
          path: packages/rusto-go.zip

  # Create GitHub Release
  binding-examples:
    name: Validate release binding consumer apps
    needs: [build-ios, build-android, package-dotnet, package-react-native]
    uses: ./.github/workflows/binding-example-ci.yml
    with:
      release-artifact-validation: true
      # Reusable workflow runs under its own run ID. Pass caller run ID so
      # actions/download-artifact fetches this Build & Release artifact set.
      build-run-id: ${{ github.run_id }}

  release:
    name: Create GitHub Release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release != false) ||
      (github.event_name == 'workflow_call' && inputs.run-release == true)
    needs: [binding-examples, build-ios, build-android, package-dotnet, package-react-native]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          for dir in rusto-x86_64-* rusto-aarch64-* rusto-android-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              tar czf "../../releases/${dir}.tar.gz" *
              cd ..
            fi
          done

          if [ -d "rusto-ios-core-xcframework" ]; then
            find rusto-ios-core-xcframework -name 'RustO.xcframework.zip' -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-android-core-aar" ]; then
            find rusto-android-core-aar -name "*.aar" -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-dotnet-core-nupkg" ]; then
            find rusto-dotnet-core-nupkg -name 'RustODotnet.*.nupkg' -exec cp {} ../releases/ \;
          fi

          for pkg_dir in rusto-react-native-package rusto-node-package rusto-python-package rusto-web-package rusto-react-package rusto-wasm-package rusto-java-package rusto-dart-package rusto-flutter-package rusto-go-package; do
            if [ -d "$pkg_dir" ]; then
              find "$pkg_dir" -type f \( -name '*.tgz' -o -name '*.tar.gz' -o -name '*.whl' -o -name '*.jar' -o -name '*.zip' \) \
                ! -name '*react-rust*' \
                ! -name '*react-native-rusto*' \
                ! -name '*rusto-web*' \
                -exec cp {} ../releases/ \;
            fi
          done

          if [ -f "../include/rusto.h" ]; then
            cp ../include/rusto.h ../releases/
          fi

      - name: Verify packed release packages
        run: |
          chmod +x scripts/verify-packed-packages.py
          python3 scripts/verify-packed-packages.py --dir releases/

      - name: Generate checksums
        working-directory: releases
        run: |
          sha256sum * > SHA256SUMS || true

      - name: Determine release tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Extract release changelog
        id: changelog
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          python3 scripts/bump_version.py --extract-changelog "${TAG}" > release_changelog.md
          if [ ! -s release_changelog.md ]; then
            echo "## RustO! Release ${TAG}" > release_changelog.md
          fi
          cat release_changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: RustO! Release ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: releases/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || contains(steps.release_info.outputs.tag, '-') }}
          generate_release_notes: true
          body_path: release_changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

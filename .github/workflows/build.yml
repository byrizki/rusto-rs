name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build iOS Rust Libraries (Parallel Matrix)
  build-ios-libs:
    name: Build iOS Lib - ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup environment
        run: |
          echo "Building MNN from source"
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Build for iOS target
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.target }}/release/build -type f -name "libMNN.a" | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.target }}
          path: mnn-static-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload iOS target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/librusto.a

  # Package iOS XCFramework
  build-ios:
    name: Build RustO iOS XCFramework
    needs: [build-ios-libs]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download default PP-OCRv6 models
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh

      - name: Download iOS Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-ios-*
          path: artifacts/ios

      - name: Create XCFramework
        run: |
          mkdir -p build/ios-device build/ios-simulator

          cp artifacts/ios/rusto-ios-aarch64-apple-ios/librusto.a build/ios-device/

          lipo -create \
            artifacts/ios/rusto-ios-aarch64-apple-ios-sim/librusto.a \
            artifacts/ios/rusto-ios-x86_64-apple-ios/librusto.a \
            -output build/ios-simulator/librusto.a

          xcodebuild -create-xcframework \
            -library build/ios-device/librusto.a \
            -library build/ios-simulator/librusto.a \
            -output build/RustO.xcframework

          echo "Copying Swift sources..."
          mkdir -p build/src
          cp -r packages/ios/src/* build/src/
          
          echo "Copying LICENSE..."
          cp LICENSE build/

          cd build
          zip -r RustO.xcframework.zip RustO.xcframework src LICENSE
          cd ..

      - name: Package iOS Model Bundles
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

          package_model_zip() {
            local model_src="$1"
            local zip_name="$2"
            local tmp_dir="build/tmp_$zip_name"
            mkdir -p "$tmp_dir"
            cp -r "$model_src"/* "$tmp_dir/"
            cd "$tmp_dir"
            zip -r "../../build/$zip_name.zip" .
            cd ../..
            rm -rf "$tmp_dir"
          }

          package_model_zip "models/PPOCR_v6_tiny" "RustO-Models-PPOCRv6-Tiny"
          package_model_zip "models/PPOCR_v6_small" "RustO-Models-PPOCRv6-Small"
          package_model_zip "models/PPOCR_v6_medium" "RustO-Models-PPOCRv6-Medium"
          package_model_zip "models/PPOCR_v5_mobile" "RustO-Models-PPOCRv5-Mobile"
          package_model_zip "models/PPOCR_v5_server" "RustO-Models-PPOCRv5-Server"
          package_model_zip "models/PPOCR_v4_mobile" "RustO-Models-PPOCRv4-Mobile"
          package_model_zip "models/PPOCR_v4_server" "RustO-Models-PPOCRv4-Server"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-xcframework
          path: |
            build/RustO.xcframework.zip
            build/RustO-Models-*.zip

  # Build Android Rust Libraries (Parallel Matrix)
  build-android-libs:
    name: Build Android Lib - ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android target
        env:
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CC_i686_linux_android: i686-linux-android21-clang
          CXX_i686_linux_android: i686-linux-android21-clang++
          AR_i686_linux_android: llvm-ar
          CC_x86_64_linux_android: x86_64-linux-android21-clang
          CXX_x86_64_linux_android: x86_64-linux-android21-clang++
          AR_x86_64_linux_android: llvm-ar
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.target }}/release/build -type f -name "libMNN.a" | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.target }}
          path: mnn-static-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload Android target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/librusto.so

  # Package Android AAR
  build-android:
    name: Build RustO Android AAR
    needs: [build-android-libs]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all OCR models
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Android Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-android-*
          path: artifacts/android

      - name: Copy libraries and assets
        run: |
          mkdir -p packages/android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp artifacts/android/rusto-android-arm64-v8a/librusto.so packages/android/src/main/jniLibs/arm64-v8a/
          cp artifacts/android/rusto-android-armeabi-v7a/librusto.so packages/android/src/main/jniLibs/armeabi-v7a/
          cp artifacts/android/rusto-android-x86/librusto.so packages/android/src/main/jniLibs/x86/
          cp artifacts/android/rusto-android-x86_64/librusto.so packages/android/src/main/jniLibs/x86_64/

          # Copy models into respective Android model submodules
          mkdir -p packages/android/models/rusto-models-ppocrv6-tiny/src/main/assets
          cp -r models/PPOCR_v6_tiny/* packages/android/models/rusto-models-ppocrv6-tiny/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv6-small/src/main/assets
          cp -r models/PPOCR_v6_small/* packages/android/models/rusto-models-ppocrv6-small/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv6-medium/src/main/assets
          cp -r models/PPOCR_v6_medium/* packages/android/models/rusto-models-ppocrv6-medium/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv5-mobile/src/main/assets
          cp -r models/PPOCR_v5_mobile/* packages/android/models/rusto-models-ppocrv5-mobile/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv5-server/src/main/assets
          cp -r models/PPOCR_v5_server/* packages/android/models/rusto-models-ppocrv5-server/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv4-mobile/src/main/assets
          cp -r models/PPOCR_v4_mobile/* packages/android/models/rusto-models-ppocrv4-mobile/src/main/assets/

          mkdir -p packages/android/models/rusto-models-ppocrv4-server/src/main/assets
          cp -r models/PPOCR_v4_server/* packages/android/models/rusto-models-ppocrv4-server/src/main/assets/

      - name: Make Gradle Wrapper executable
        working-directory: packages/android
        run: chmod +x gradlew || true

      - name: Build AARs
        working-directory: packages/android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-aar
          path: packages/android/**/build/outputs/aar/*.aar

  # Build .NET NuGet package
  build-dotnet:
    name: Build .NET NuGet - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            runner: ubuntu-22.04
            lib: librusto.so
            rust_target: x86_64-unknown-linux-gnu
          - os: macos
            arch: x64
            target: osx-x64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            target: osx-arm64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: x64
            target: win-x64
            runner: windows-2022
            lib: rusto.dll
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build for target
        shell: bash
        run: cargo build --release --target ${{ matrix.rust_target }} --features ffi

      - name: Copy native library
        shell: bash
        run: |
          mkdir -p packages/dotnet/runtimes/${{ matrix.target }}/native
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} packages/dotnet/runtimes/${{ matrix.target }}/native/
          else
            cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} packages/dotnet/runtimes/${{ matrix.target }}/native/
          fi

      - name: Package MNN static prebuilt
        shell: bash
        run: |
          mkdir -p mnn-prebuilt-pkg
          LIB_MNN=$(find target/${{ matrix.rust_target }}/release/build -type f \( -name "libMNN.a" -o -name "MNN.lib" \) | head -n 1)
          if [ -n "$LIB_MNN" ]; then
            cp "$LIB_MNN" mnn-prebuilt-pkg/
            tar -czf "mnn-static-${{ matrix.rust_target }}.tar.gz" -C mnn-prebuilt-pkg $(basename "$LIB_MNN")
          else
            echo "::warning::libMNN static library not found for ${{ matrix.rust_target }}"
          fi

      - name: Upload MNN prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-static-${{ matrix.rust_target }}
          path: mnn-static-${{ matrix.rust_target }}.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-${{ matrix.target }}
          path: packages/dotnet/runtimes/${{ matrix.target }}/**/*

  # Package .NET NuGet
  package-dotnet:
    name: Package .NET NuGet
    needs: [build-dotnet]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download all .NET artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-dotnet-*
          path: artifacts

      - name: Merge runtime artifacts
        run: |
          mkdir -p packages/dotnet/runtimes
          for dir in artifacts/rusto-dotnet-*; do
            target=$(basename "$dir" | sed 's/rusto-dotnet-//')
            echo "Processing artifact: $dir (target: $target)"
            
            if [ -d "$dir/native" ]; then
              mkdir -p "packages/dotnet/runtimes/$target"
              cp -rv "$dir/native" "packages/dotnet/runtimes/$target/"
              echo "Copied native files for $target"
            fi
          done

      - name: Download all OCR models
        run: |
          chmod +x scripts/download_models.sh
          bash scripts/download_models.sh --all

      - name: Prepare model packages
        run: |
          echo "=== Copying model files to model NuGet packages ==="
          
          # Setup PPOCRv6 Tiny models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv6.Tiny/models
          cp models/PPOCR_v6_tiny/* packages/dotnet/models/RustODotnet.Models.PPOCRv6.Tiny/models/

          # Setup PPOCRv6 Small models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv6.Small/models
          cp models/PPOCR_v6_small/* packages/dotnet/models/RustODotnet.Models.PPOCRv6.Small/models/

          # Setup PPOCRv6 Medium models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv6.Medium/models
          cp models/PPOCR_v6_medium/* packages/dotnet/models/RustODotnet.Models.PPOCRv6.Medium/models/

          # Setup PPOCRv5 Mobile models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv5.Mobile/models
          cp models/PPOCR_v5_mobile/* packages/dotnet/models/RustODotnet.Models.PPOCRv5.Mobile/models/

          # Setup PPOCRv5 Server models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv5.Server/models
          cp models/PPOCR_v5_server/* packages/dotnet/models/RustODotnet.Models.PPOCRv5.Server/models/

          # Setup PPOCRv4 Mobile models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv4.Mobile/models
          cp models/PPOCR_v4_mobile/* packages/dotnet/models/RustODotnet.Models.PPOCRv4.Mobile/models/

          # Setup PPOCRv4 Server models
          mkdir -p packages/dotnet/models/RustODotnet.Models.PPOCRv4.Server/models
          cp models/PPOCR_v4_server/* packages/dotnet/models/RustODotnet.Models.PPOCRv4.Server/models/

      - name: Build and Pack NuGet Packages
        run: |
          mkdir -p nupkg
          
          echo "=== Packing Core Runtime ==="
          cd packages/dotnet
          dotnet build RustODotnet.csproj -c Release
          dotnet pack RustODotnet.csproj -c Release -o ../../nupkg -v detailed
          cd ../..

          echo "=== Packing Model Packages ==="
          for proj in packages/dotnet/models/*/*.csproj; do
            if [ -f "$proj" ]; then
              echo "Packing $proj..."
              dotnet pack "$proj" -c Release -o nupkg -v detailed
            fi
          done

          echo "\n=== Generated Packages ==="
          ls -lh nupkg/*.nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-nupkg
          path: |
            nupkg/*.nupkg
            packages/dotnet/runtimes/**/*

  # package React Native
  package-react-native:
    name: Package React Native
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      - name: Pack NPM package
        working-directory: packages/react-native
        run: |
          npm install --legacy-peer-deps
          npm pack

      - name: Upload NPM package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-native-package
          path: packages/react-native/*.tgz

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs: [build-ios, build-android, package-dotnet, package-react-native]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          for dir in rusto-x86_64-* rusto-aarch64-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              tar czf "../../releases/${dir}.tar.gz" *
              cd ..
            fi
          done

          if [ -d "rusto-ios-xcframework" ]; then
            cp rusto-ios-xcframework/*.zip ../releases/ || true
          fi

          if [ -d "rusto-android-aar" ]; then
            find rusto-android-aar -name "*.aar" -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-dotnet-nupkg" ]; then
            cd rusto-dotnet-nupkg
            if [ -d "nupkg" ]; then
              cp nupkg/*.nupkg ../../releases/ || true
            fi
            if [ -d "packages/dotnet/runtimes" ]; then
              tar czf "../../releases/rusto-dotnet-runtimes.tar.gz" packages/dotnet/runtimes/
            fi
            cd ..
          fi

          if [ -d "rusto-react-native-package" ]; then
             cp rusto-react-native-package/*.tgz ../releases/ || true
          fi

          for f in mnn-static-*/*.tar.gz; do
            if [ -f "$f" ]; then
              cp "$f" ../releases/ || true
            fi
          done

      - name: Generate checksums
        working-directory: releases
        run: |
          sha256sum * > SHA256SUMS || true

      - name: Determine release tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: RustO! Release ${{ steps.release_info.outputs.tag }}
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RustO! Release ${{ steps.release_info.outputs.tag }}

            ### Highlights
            - Pure Rust OCR library powered by PaddleOCR models
            - Uses MNN inference engine for optimal performance
            - Cross-platform support (Linux, macOS, Windows, iOS, Android, .NET)
            - Includes bundled model files and dictionary files

            ### Platform Support
            - **Linux**: x64, ARM64
            - **macOS**: x64 (Intel), ARM64 (Apple Silicon)
            - **Windows**: x64
            - **iOS**: Universal XCFramework (device + simulator)
            - **Android**: AAR with all architectures (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **.NET**: NuGet package with native libraries for all desktop platforms
            - **React Native**: NPM package with bundled binaries

            ### Installation
            Download the appropriate package for your platform and extract it.
            See SHA256SUMS for file verification.

            ### Inference Engine
            - Uses MNN (Mobile Neural Network) for efficient inference
            - Includes pre-converted PaddleOCR models in MNN format
            - Supports multiple languages via included dictionary files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

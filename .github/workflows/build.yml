name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build iOS Rust Libraries (Parallel Matrix)
  build-ios-libs:
    name: Build iOS Lib - ${{ matrix.target }}
    # Keep artifact object format/toolchain compatible with RN consumer build.
    # macos-latest advanced to Xcode 26 while examples use macos-15/Xcode 16.
    runs-on: macos-15
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup environment
        run: |
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Build for iOS target
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Upload iOS target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/librusto.a

  # Package iOS XCFramework
  build-ios:
    name: Build RustO iOS XCFramework
    needs: [build-ios-libs]
    # Package with same Xcode generation as build-ios-libs and CI consumers.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-ios-*
          path: artifacts/ios

      - name: Create XCFramework
        run: |
          mkdir -p build/ios-device build/ios-simulator

          # `RustO` pod compiles Swift bridge into libRustO.a. APFS is normally
          # case-insensitive, so core librusto.a collides with that output when
          # CocoaPods passes -lrusto. Use distinct core name in XCFramework.
          cp artifacts/ios/rusto-ios-aarch64-apple-ios/librusto.a \
            build/ios-device/libRustoCore.a

          lipo -create \
            artifacts/ios/rusto-ios-aarch64-apple-ios-sim/librusto.a \
            artifacts/ios/rusto-ios-x86_64-apple-ios/librusto.a \
            -output build/ios-simulator/libRustoCore.a

          xcodebuild -create-xcframework \
            -library build/ios-device/libRustoCore.a \
            -library build/ios-simulator/libRustoCore.a \
            -output build/RustO.xcframework

          # Keep release framework artifact binary-only. Swift sources belong
          # in CocoaPods/npm source packages; staging them here can hide an ABI
          # mismatch between current bridge code and older static archives.
          (cd build && zip -r RustO.xcframework.zip RustO.xcframework)

      - name: Package iOS Model Bundle for Test Fixtures
        run: |
          chmod +x scripts/download_models.sh
          python3 -m pip install --upgrade rten-convert --break-system-packages || python3 -m pip install rten-convert || true
          bash scripts/download_models.sh --model ppocrv6 --tier tiny --convert-rten

          package_model_zip() {
            local model_src="$1"
            local zip_name="$2"
            local tmp_dir="build/tmp_$zip_name"
            mkdir -p "$tmp_dir"
            cp -r "$model_src"/* "$tmp_dir/"
            rm -f "$tmp_dir"/*.onnx
            (cd "$tmp_dir" && zip -r "../../build/$zip_name.zip" .)
            rm -rf "$tmp_dir"
          }

          package_model_zip "models/PPOCR_v6_tiny" "RustO-Models-PPOCRv6-Tiny"

      - name: Verify XCFramework exports canonical FFI ABI
        run: |
          set -euo pipefail
          archives=(build/RustO.xcframework/*/*.a)
          test "${#archives[@]}" -eq 2
          for archive in "${archives[@]}"; do
            test -f "$archive"
            echo "Checking $archive"
            symbols="$(strings "$archive")"
            for symbol in \
              rocr_initialize rocr_detect_text_file rocr_detect_text_data \
              rocr_detect_text_file_spatial rocr_detect_text_data_spatial \
              rocr_free_results rocr_free_string rocr_free rocr_version; do
              grep -Fxq "_$symbol" <<<"$symbols"
            done
          done

      - name: Upload core XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-core-xcframework
          path: build/RustO.xcframework.zip

      - name: Upload each iOS model resource artifact
        run: |
          set -euo pipefail
          for model_zip in build/RustO-Models-*.zip; do
            test -f "$model_zip"
            model_id="$(basename "$model_zip" .zip | sed 's/^RustO-Models-//' | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
            mkdir -p "artifacts/ios-models/$model_id"
            cp "$model_zip" "artifacts/ios-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-model-resources
          path: artifacts/ios-models/

  # Build Android Rust Libraries (Parallel Matrix)
  build-android-libs:
    name: Build Android Lib - ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android target
        env:
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CC_i686_linux_android: i686-linux-android21-clang
          CXX_i686_linux_android: i686-linux-android21-clang++
          AR_i686_linux_android: llvm-ar
          CC_x86_64_linux_android: x86_64-linux-android21-clang
          CXX_x86_64_linux_android: x86_64-linux-android21-clang++
          AR_x86_64_linux_android: llvm-ar
        run: cargo build --release --target ${{ matrix.target }} --features ffi

      - name: Upload Android target library
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/librusto.so

  # Package Android AAR
  build-android:
    name: Build RustO Android AAR
    needs: [build-android-libs]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download PP-OCRv6 Tiny model for test fixture
        run: |
          chmod +x scripts/download_models.sh
          python3 -m pip install --upgrade rten-convert --break-system-packages || python3 -m pip install rten-convert || true
          bash scripts/download_models.sh --model ppocrv6 --tier tiny --convert-rten

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Android Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-android-*
          path: artifacts/android

      - name: Copy libraries and assets
        run: |
          mkdir -p packages/android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp artifacts/android/rusto-android-arm64-v8a/librusto.so packages/android/src/main/jniLibs/arm64-v8a/
          cp artifacts/android/rusto-android-armeabi-v7a/librusto.so packages/android/src/main/jniLibs/armeabi-v7a/
          cp artifacts/android/rusto-android-x86/librusto.so packages/android/src/main/jniLibs/x86/
          cp artifacts/android/rusto-android-x86_64/librusto.so packages/android/src/main/jniLibs/x86_64/

          # Copy PP-OCRv6 Tiny model into Android model submodule for consumer validation
          pkg_dir="packages/android/models/rusto-models-ppocrv6-tiny"
          if [ -d "models/PPOCR_v6_tiny" ]; then
            mkdir -p "$pkg_dir/src/main/assets"
            cp -r models/PPOCR_v6_tiny/* "$pkg_dir/src/main/assets/"
            rm -f "$pkg_dir/src/main/assets/"*.onnx
            echo "Copied models/PPOCR_v6_tiny -> $pkg_dir/src/main/assets/"
          fi

      - name: Make Gradle Wrapper executable
        working-directory: packages/android
        run: chmod +x gradlew || true

      - name: Build AARs
        working-directory: packages/android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Separate Android core and model AAR artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-core artifacts/android-models
          find packages/android/build/outputs/aar -name '*-release.aar' -exec cp {} artifacts/android-core/ \;
          test "$(find artifacts/android-core -name '*.aar' | wc -l | tr -d ' ')" = 1
          for aar in packages/android/models/*/build/outputs/aar/*-release.aar; do
            test -f "$aar"
            model_id="$(basename "$aar" | sed -E 's/^rusto-models-//; s/-release\.aar$//')"
            mkdir -p "artifacts/android-models/$model_id"
            cp "$aar" "artifacts/android-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-android-core-aar
          path: artifacts/android-core/
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-android-model-aars
          path: artifacts/android-models/

  # Build .NET NuGet package
  build-dotnet:
    name: Build .NET NuGet - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            runner: ubuntu-22.04
            lib: librusto.so
            rust_target: x86_64-unknown-linux-gnu
          - os: macos
            arch: x64
            target: osx-x64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            target: osx-arm64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: x64
            target: win-x64
            runner: windows-2022
            lib: rusto.dll
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build for target
        shell: bash
        run: cargo build --release --target ${{ matrix.rust_target }} --features ffi

      - name: Copy native library
        shell: bash
        run: |
          mkdir -p packages/dotnet/runtimes/${{ matrix.target }}/native
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} \
             packages/dotnet/runtimes/${{ matrix.target }}/native/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-${{ matrix.target }}
          path: packages/dotnet/runtimes/${{ matrix.target }}/**/*

  # Package .NET NuGet
  package-dotnet:
    name: Package .NET NuGet
    needs: [build-dotnet]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download all .NET artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-dotnet-*
          path: artifacts

      - name: Merge runtime artifacts
        run: |
          mkdir -p packages/dotnet/runtimes
          for dir in artifacts/rusto-dotnet-*; do
            target=$(basename "$dir" | sed 's/rusto-dotnet-//')
            echo "Processing artifact: $dir (target: $target)"
            src="$dir/packages/dotnet/runtimes/$target/native"
            if [ -d "$src" ]; then
              mkdir -p "packages/dotnet/runtimes/$target/native"
              cp -rv "$src"/. "packages/dotnet/runtimes/$target/native/"
              echo "Copied native files for $target"
            else
              echo "Warning: native dir not found at $src"
            fi
          done

      - name: Download PP-OCRv6 Tiny model for test fixture
        run: |
          chmod +x scripts/download_models.sh
          python3 -m pip install --upgrade rten-convert --break-system-packages || python3 -m pip install rten-convert || true
          bash scripts/download_models.sh --model ppocrv6 --tier tiny --convert-rten

      - name: Prepare test model package
        run: |
          pkg_dir="packages/dotnet/models/RustODotnet.Models.PPOCRv6.Tiny"
          if [ -d "models/PPOCR_v6_tiny" ]; then
            mkdir -p "$pkg_dir/models"
            cp -r models/PPOCR_v6_tiny/* "$pkg_dir/models/"
            rm -f "$pkg_dir/models/"*.onnx
            echo "Copied models/PPOCR_v6_tiny -> $pkg_dir/models/"
          fi

      - name: Build and Pack NuGet Packages
        run: |
          mkdir -p nupkg
          
          echo "=== Packing Core Runtime ==="
          cd packages/dotnet
          dotnet build RustODotnet.csproj -c Release
          dotnet pack RustODotnet.csproj -c Release -o ../../nupkg -v detailed
          cd ../..

          echo "=== Packing Test Model Package ==="
          test_proj="packages/dotnet/models/RustODotnet.Models.PPOCRv6.Tiny/RustODotnet.Models.PPOCRv6.Tiny.csproj"
          if [ -f "$test_proj" ]; then
            dotnet pack "$test_proj" -c Release -o nupkg -v detailed
          fi

          printf '\n=== Generated Packages ===\n'
          ls -lh nupkg/*.nupkg

      - name: Separate .NET core and model NuGet artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts/dotnet-core artifacts/dotnet-models
          core="$(find nupkg -maxdepth 1 -name 'RustODotnet.[0-9]*.nupkg' -print -quit)"
          test -n "$core"
          cp "$core" artifacts/dotnet-core/
          for nupkg in nupkg/RustODotnet.Models.*.nupkg; do
            test -f "$nupkg"
            model_id="$(basename "$nupkg" | sed -E 's/^RustODotnet\.Models\.//; s/\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg$//' | tr '[:upper:]' '[:lower:]' | tr '.' '-')"
            mkdir -p "artifacts/dotnet-models/$model_id"
            cp "$nupkg" "artifacts/dotnet-models/$model_id/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-core-nupkg
          path: artifacts/dotnet-core/
      - uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-model-nupkgs
          path: artifacts/dotnet-models/

  # package NPM packages (React Native, Web, React)
  package-react-native:
    name: Package NPM Packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify Yarn Classic
        run: yarn --version

      - name: Install Rust toolchain for WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build rten-wasm
        run: |
          wasm-pack build crates/rten-wasm --target web --out-dir ../../packages/web/src/wasm
          mkdir -p artifacts/wasm
          tar czf artifacts/wasm/rusto-wasm.tar.gz -C packages/web/src/wasm .
          cp artifacts/wasm/rusto-wasm.tar.gz artifacts/wasm/rusto-wasm.tgz

      - name: Build and pack @rustors/web
        working-directory: packages/web
        run: |
          npm install
          npm run build
          npm pack --pack-destination ..

      - name: Build and pack @rustors/react
        working-directory: packages/react
        run: |
          npm install
          npm run build
          npm pack --pack-destination ..

      - name: Install React Native package build dependencies
        working-directory: packages/react-native
        run: yarn install --ignore-scripts --non-interactive

      - name: Build and pack React Native package
        working-directory: packages/react-native
        run: |
          yarn prepare
          yarn pack --filename ../rustors-react-native.tgz

      - name: Upload React Native package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-native-package
          path: packages/rustors-react-native.tgz

      - name: Upload @rustors/web package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-web-package
          path: packages/rust*web-*.tgz

      - name: Upload @rustors/react package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-package
          path: packages/rust*react-*.tgz

      - name: Upload rusto-wasm package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-wasm-package
          path: |
            artifacts/wasm/rusto-wasm.tar.gz
            artifacts/wasm/rusto-wasm.tgz

  # Create GitHub Release
  binding-examples:
    name: Validate release binding consumer apps
    needs: [build-ios, build-android, package-dotnet, package-react-native]
    uses: ./.github/workflows/binding-example-ci.yml
    with:
      release-artifact-validation: true
      # Reusable workflow runs under its own run ID. Pass caller run ID so
      # actions/download-artifact fetches this Build & Release artifact set.
      build-run-id: ${{ github.run_id }}

  release:
    name: Create GitHub Release
    needs: [binding-examples, build-ios, build-android, package-dotnet, package-react-native]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          for dir in rusto-x86_64-* rusto-aarch64-* rusto-android-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              tar czf "../../releases/${dir}.tar.gz" *
              cd ..
            fi
          done

          if [ -d "rusto-ios-core-xcframework" ]; then
            find rusto-ios-core-xcframework -name 'RustO.xcframework.zip' -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-android-core-aar" ]; then
            find rusto-android-core-aar -name "*.aar" -exec cp {} ../releases/ \;
          fi

          if [ -d "rusto-dotnet-core-nupkg" ]; then
            find rusto-dotnet-core-nupkg -name 'RustODotnet.*.nupkg' -exec cp {} ../releases/ \;
          fi

          for pkg_dir in rusto-react-native-package rusto-web-package rusto-react-package rusto-wasm-package; do
            if [ -d "$pkg_dir" ]; then
              find "$pkg_dir" -type f \( -name '*.tgz' -o -name '*.tar.gz' \) -exec cp {} ../releases/ \;
            fi
          done

      - name: Generate checksums
        working-directory: releases
        run: |
          sha256sum * > SHA256SUMS || true

      - name: Determine release tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: RustO! Release ${{ steps.release_info.outputs.tag }}
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RustO! Release ${{ steps.release_info.outputs.tag }}

            ### Highlights
            - Pure Rust OCR library powered by PaddleOCR models
            - Uses RTen pure-Rust neural network engine for optimal inference performance
            - Cross-platform support (Linux, macOS, Windows, iOS, Android, .NET, Web/WASM, React)
            - OCR models are packaged and released separately under `models-rten-v*` tags

            ### Platform Support
            - **Linux**: x64, ARM64
            - **macOS**: x64 (Intel), ARM64 (Apple Silicon)
            - **Windows**: x64
            - **iOS**: Universal XCFramework (device + simulator)
            - **Android**: AAR with all architectures (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **.NET**: NuGet package with native libraries for all desktop platforms
            - **NPM / React Native**: React Native bindings (`@rustors/react-native`)
            - **NPM / Web**: WebAssembly engine (`@rustors/web`) and React UI hooks (`@rustors/react`)

            ### Installation
            Download the appropriate package for your platform and extract it.
            See SHA256SUMS for file verification.

            ### Inference Engine
            - Uses RTen pure-Rust inference engine
            - Supports PaddleOCR models in ONNX and RTen formats
            - Supports multiple languages via included dictionary files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.3). Leave empty to use version from Cargo.toml'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build iOS XCFramework
  build-ios:
    name: Build RustO iOS XCFramework
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Setup environment
        run: |
          echo "Building MNN from source"
          echo "IPHONEOS_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      - name: Build for iOS targets
        run: |
          cargo build --release --target aarch64-apple-ios --features ffi
          cargo build --release --target aarch64-apple-ios-sim --features ffi
          cargo build --release --target x86_64-apple-ios --features ffi

      - name: Create XCFramework
        run: |
          mkdir -p build/ios-device build/ios-simulator

          cp target/aarch64-apple-ios/release/librusto.a build/ios-device/

          lipo -create \
            target/aarch64-apple-ios-sim/release/librusto.a \
            target/x86_64-apple-ios/release/librusto.a \
            -output build/ios-simulator/librusto.a

          xcodebuild -create-xcframework \
            -library build/ios-device/librusto.a \
            -library build/ios-simulator/librusto.a \
            -output build/RustO.xcframework

          # Copy model files to React Native iOS models directory (for RN bundling)
          echo "=== Preparing models for React Native bundling ==="
          mkdir -p packages/react-native/ios/models

          echo "Copying model files..."
          cp models/PPOCR_v5/det.mnn packages/react-native/ios/models/
          cp models/PPOCR_v5/rec.mnn packages/react-native/ios/models/
          cp models/PPOCR_v5/dict.txt packages/react-native/ios/models/

          echo "\nFiles in React Native iOS models/:"
          ls -lh packages/react-native/ios/models/ || echo "No files copied"


          # Create resource bundle for standalone iOS XCFramework
          echo "=== Preparing iOS Release Artifact ==="
          mkdir -p build/Resources
          
          echo "Copying models to build/Resources..."
          cp models/PPOCR_v5/det.mnn build/Resources/
          cp models/PPOCR_v5/rec.mnn build/Resources/
          cp models/PPOCR_v5/dict.txt build/Resources/
          
          echo "Copying Swift sources..."
          mkdir -p build/src
          cp -r packages/ios/src/* build/src/
          
          echo "Copying LICENSE..."
          cp LICENSE build/
          
          echo "\nFiles in build/:"
          ls -R build/

          # Package XCFramework, Resources, src, and LICENSE
          cd build
          zip -r RustO.xcframework.zip RustO.xcframework Resources src LICENSE
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-ios-xcframework
          path: build/RustO.xcframework.zip

  # Build Android AAR
  build-android:
    name: Build RustO Android AAR
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpthread-stubs0-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Setup NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build for Android targets
        env:
          CC_aarch64_linux_android: aarch64-linux-android21-clang
          CXX_aarch64_linux_android: aarch64-linux-android21-clang++
          AR_aarch64_linux_android: llvm-ar
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi21-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CC_i686_linux_android: i686-linux-android21-clang
          CXX_i686_linux_android: i686-linux-android21-clang++
          AR_i686_linux_android: llvm-ar
          CC_x86_64_linux_android: x86_64-linux-android21-clang
          CXX_x86_64_linux_android: x86_64-linux-android21-clang++
          AR_x86_64_linux_android: llvm-ar
        run: |
          cargo build --release --target aarch64-linux-android --features ffi
          cargo build --release --target armv7-linux-androideabi --features ffi
          cargo build --release --target i686-linux-android --features ffi
          cargo build --release --target x86_64-linux-android --features ffi

          mkdir -p packages/android/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}
          cp target/aarch64-linux-android/release/librusto.so packages/android/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/librusto.so packages/android/src/main/jniLibs/armeabi-v7a/
          cp target/i686-linux-android/release/librusto.so packages/android/src/main/jniLibs/x86/
          cp target/x86_64-linux-android/release/librusto.so packages/android/src/main/jniLibs/x86_64/

          # Copy model files to main Android package and React Native package
          echo "=== Copying model files for bundling ==="
          mkdir -p packages/android/src/main/assets
          mkdir -p packages/react-native/android/src/main/assets

          echo "Copying to packages/android/src/main/assets/..."
          cp models/PPOCR_v5/det.mnn packages/android/src/main/assets/
          cp models/PPOCR_v5/rec.mnn packages/android/src/main/assets/
          cp models/PPOCR_v5/dict.txt packages/android/src/main/assets/

          echo "Copying to packages/react-native/android/src/main/assets/..."
          cp models/PPOCR_v5/det.mnn packages/react-native/android/src/main/assets/
          cp models/PPOCR_v5/rec.mnn packages/react-native/android/src/main/assets/
          cp models/PPOCR_v5/dict.txt packages/react-native/android/src/main/assets/

          echo "\nFiles in Android package assets/:"
          ls -lh packages/android/src/main/assets/ || echo "No files copied"
          echo "\nFiles in React Native Android package assets/:"
          ls -lh packages/react-native/android/src/main/assets/ || echo "No files copied"

      - name: Make Gradle Wrapper executable
        working-directory: packages/android
        run: chmod +x gradlew

      - name: Build AAR
        working-directory: packages/android
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-android-aar
          path: packages/android/build/outputs/aar/*.aar

  # Build .NET NuGet package
  build-dotnet:
    name: Build .NET NuGet - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            runner: ubuntu-22.04
            lib: librusto.so
            rust_target: x86_64-unknown-linux-gnu
          - os: macos
            arch: x64
            target: osx-x64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: x86_64-apple-darwin
          - os: macos
            arch: arm64
            target: osx-arm64
            runner: macos-latest
            lib: librusto.dylib
            rust_target: aarch64-apple-darwin
          - os: windows
            arch: x64
            target: win-x64
            runner: windows-2022
            lib: rusto.dll
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup environment
        shell: bash
        run: |
          echo "Building MNN from source"
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          fi

      - name: Build native library
        run: cargo build --release --target ${{ matrix.rust_target }} --features ffi

      - name: Create runtimes directory
        shell: bash
        run: mkdir -p packages/dotnet/runtimes/${{ matrix.target }}/native

      - name: Copy library (Unix)
        if: matrix.os != 'windows'
        run: |
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} packages/dotnet/runtimes/${{ matrix.target }}/native/

      - name: Copy library (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cp target/${{ matrix.rust_target }}/release/${{ matrix.lib }} packages/dotnet/runtimes/${{ matrix.target }}/native/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-${{ matrix.target }}
          path: packages/dotnet/runtimes/${{ matrix.target }}/**/*

  # Package .NET NuGet
  package-dotnet:
    name: Package .NET NuGet
    needs: [build-dotnet]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download all .NET artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rusto-dotnet-*
          path: artifacts

      - name: Merge runtime artifacts
        run: |
          mkdir -p packages/dotnet/runtimes
          for dir in artifacts/rusto-dotnet-*; do
            # Extract target name from artifact directory (e.g., rusto-dotnet-linux-x64 -> linux-x64)
            target=$(basename "$dir" | sed 's/rusto-dotnet-//')
            echo "Processing artifact: $dir (target: $target)"
            
            # The artifact contains native/* directly, we need to copy to runtimes/{target}/native/
            if [ -d "$dir/native" ]; then
              mkdir -p "packages/dotnet/runtimes/$target"
              cp -rv "$dir/native" "packages/dotnet/runtimes/$target/"
              echo "Copied native files for $target"
            else
              echo "Warning: No native directory found in $dir"
              echo "Contents of $dir:"
              ls -la "$dir" || true
            fi
          done

          echo ""
          echo "=== Final runtimes structure ==="
          find packages/dotnet/runtimes -type f || echo "No runtime files found"

      - name: Copy model files to package
        run: |
          echo "=== Copying model files to NuGet package ==="
          mkdir -p packages/dotnet/models

          echo "Looking for .mnn files:"
          find models/ -name "*.mnn" -type f

          echo "Looking for .txt files:"
          find models/ -name "*.txt" -type f

          echo "Copying .mnn files..."
          find models/ -name "*.mnn" -exec sh -c 'echo "  Copying: $1"; cp "$1" packages/dotnet/models/' _ {} \; || true

          echo "Copying .txt files..."
          find models/ -name "*.txt" -exec sh -c 'echo "  Copying: $1"; cp "$1" packages/dotnet/models/' _ {} \; || true

          echo "\nFiles in packages/dotnet/models/:"
          ls -lh packages/dotnet/models/ || echo "No files copied"

      - name: Build Project package
        working-directory: packages/dotnet
        run: |
          echo "=== Building .NET package ==="
          echo "Current directory: $(pwd)"
          echo "\nFiles in runtimes/:"
          find runtimes/ -type f | head -20
          echo "\nFiles in models/:"
          ls -lh models/ || echo "No models directory"
          echo "\nBuilding..."
          dotnet build -c Release || echo "Build will be done manually"

      - name: Pack NuGet package
        working-directory: packages/dotnet
        run: |
          echo "=== Packing NuGet package ==="
          echo "Project file contents:"
          cat RustO.csproj | grep -A 5 "<ItemGroup>" || true
          echo "\nPacking to ../../nupkg"
          dotnet pack -c Release -o ../../nupkg -v detailed || echo "NuGet pack will be done manually"
          echo "\nGenerated packages:"
          ls -lh ../../nupkg/ || echo "No packages generated"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-dotnet-nupkg
          path: |
            nupkg/*.nupkg
            packages/dotnet/runtimes/**/*

  # package React Native
  package-react-native:
    name: Package React Native
    needs: [build-ios, build-android]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: "https://registry.npmjs.org"

      # Download iOS XCFramework
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: rusto-ios-xcframework
          path: artifacts/ios

      # Download Android AAR
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: rusto-android-aar
          path: artifacts/android

      - name: Prepare React Native package
        run: |
          # Setup directories
          mkdir -p packages/react-native/ios
          mkdir -p packages/react-native/android/libs

          # Extract and copy iOS XCFramework
          unzip artifacts/ios/RustO.xcframework.zip -d artifacts/ios/temp
          cp -r artifacts/ios/temp/RustO.xcframework packages/react-native/ios/

          # Copy model files for iOS bundling
          echo "Copying models for iOS bundling..."
          mkdir -p packages/react-native/ios/models
          cp models/PPOCR_v5/det.mnn packages/react-native/ios/models/
          cp models/PPOCR_v5/rec.mnn packages/react-native/ios/models/
          cp models/PPOCR_v5/dict.txt packages/react-native/ios/models/

          echo "Files in React Native iOS models/:"
          ls -lh packages/react-native/ios/models/ || echo "No files copied"

          # Copy Android AAR
          cp artifacts/android/*.aar packages/react-native/android/libs/RustO.aar

      - name: Pack NPM package
        working-directory: packages/react-native
        run: |
          npm install --legacy-peer-deps
          npm pack

      - name: Upload NPM package
        uses: actions/upload-artifact@v4
        with:
          name: rusto-react-native-package
          path: packages/react-native/*.tgz

  # Create GitHub Release
  release:
    name: Create GitHub Release
    needs: [build-ios, build-android, package-dotnet, package-react-native]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        run: |
          mkdir -p releases
          cd artifacts

          for dir in rusto-x86_64-* rusto-aarch64-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              tar czf "../../releases/${dir}.tar.gz" *
              cd ..
            fi
          done

          if [ -d "rusto-ios-xcframework" ]; then
            cp rusto-ios-xcframework/RustO.xcframework.zip ../releases/ || true
          fi

          if [ -d "rusto-android-aar" ]; then
            cp rusto-android-aar/*.aar ../releases/ || true
          fi

          if [ -d "rusto-dotnet-nupkg" ]; then
            cd rusto-dotnet-nupkg
            if [ -d "nupkg" ]; then
              cp nupkg/*.nupkg ../../releases/ || true
            fi
            if [ -d "packages/dotnet/runtimes" ]; then
              tar czf "../../releases/rusto-dotnet-runtimes.tar.gz" packages/dotnet/runtimes/
            fi
            cd ..
          fi

          if [ -d "rusto-react-native-package" ]; then
             cp rusto-react-native-package/*.tgz ../releases/ || true
          fi

      - name: Generate checksums
        working-directory: releases
        run: |
          sha256sum * > SHA256SUMS || true

      - name: Determine release tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(grep -m1 '^version\s*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: RustO! Release ${{ steps.release_info.outputs.tag }}
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## RustO! Release ${{ steps.release_info.outputs.tag }}

            ### Highlights
            - Pure Rust OCR library powered by PaddleOCR models
            - Uses MNN inference engine for optimal performance
            - Cross-platform support (Linux, macOS, Windows, iOS, Android, .NET)
            - Includes bundled model files and dictionary files

            ### Platform Support
            - **Linux**: x64, ARM64
            - **macOS**: x64 (Intel), ARM64 (Apple Silicon)
            - **Windows**: x64
            - **iOS**: Universal XCFramework (device + simulator)
            - **Android**: AAR with all architectures (arm64-v8a, armeabi-v7a, x86, x86_64)
            - **.NET**: NuGet package with native libraries for all desktop platforms
            - **React Native**: NPM package with bundled binaries

            ### Installation
            Download the appropriate package for your platform and extract it.
            See SHA256SUMS for file verification.

            ### Inference Engine
            - Uses MNN (Mobile Neural Network) for efficient inference
            - Includes pre-converted PaddleOCR models in MNN format
            - Supports multiple languages via included dictionary files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish Libraries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.3.0)'
        required: true
        default: '0.3.2'
      publish_crates:
        description: 'Publish to Crates.io'
        type: boolean
        required: false
        default: true
      publish_nuget:
        description: 'Publish Core to NuGet'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish Core to NPM'
        type: boolean
        required: false
        default: true
      publish_cocoapods:
        description: 'Publish Core to CocoaPods'
        type: boolean
        required: false
        default: true
      publish_pypi:
        description: 'Publish Python to PyPI'
        type: boolean
        required: false
        default: true
      publish_pub_dev:
        description: 'Publish Dart & Flutter to Pub.dev'
        type: boolean
        required: false
        default: true
      publish_jitpack:
        description: 'Trigger JitPack Build (Android & Java)'
        type: boolean
        required: false
        default: true

jobs:
  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_crates == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        run: |
          publish_crate() {
            local pkg="$1"
            local max_attempts=4
            local delay=15
            
            for attempt in $(seq 1 $max_attempts); do
              echo "==> Publishing $pkg (Attempt $attempt/$max_attempts)..."
              output=$(cargo publish -p "$pkg" --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1) && {
                echo "$output"
                echo "Successfully published $pkg"
                return 0
              }
              
              echo "$output"
              
              if echo "$output" | grep -qi "already uploaded\|already exists"; then
                echo "Package $pkg is already published on crates.io, skipping."
                return 0
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "Failed to publish $pkg. Retrying in ${delay}s..."
                sleep $delay
                delay=$((delay * 2))
              else
                echo "Failed to publish $pkg after $max_attempts attempts."
                return 1
              fi
            done
          }
          
          publish_crate rusto-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish Core to NuGet
  publish-nuget:
    name: Publish Core to NuGet
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_nuget == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Download Core NuGet package from release
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          # Download nupkg from GitHub release
          gh release download "v${VERSION}" -p "RustODotnet.*.nupkg" -Dpackages/dotnet || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify NuGet packages before publishing
        run: |
          chmod +x scripts/verify-packed-packages.py
          python3 scripts/verify-packed-packages.py --dir packages/dotnet/

      - name: Publish Core to NuGet
        working-directory: packages/dotnet
        run: |
          find . -name "RustODotnet.*.nupkg" ! -name "RustODotnet.Models.*" | while read pkg; do
            echo "Pushing $pkg to NuGet..."
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || true
          done
        continue-on-error: true

  # Publish Core to NPM
  publish-npm:
    name: Publish Core to NPM
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_npm == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Download Core NPM packages from release
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p npm-packages
          # Download core library tgz from GitHub release
          gh release download "v${VERSION}" -p "rustors-*.tgz" -D npm-packages/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify NPM packages before publishing
        run: |
          chmod +x scripts/verify-packed-packages.py
          python3 scripts/verify-packed-packages.py --dir npm-packages/

      - name: Publish Core to NPM
        run: |
          find npm-packages -name "*.tgz" -type f | while read -r pkg; do
            pkg_name="$(basename "$pkg")"
            if [[ "$pkg_name" =~ rustors-model ]]; then
              continue
            fi
            if [[ "$pkg_name" =~ (react-rust|react-rusto|react-native-rusto|rusto-web|rusto-wasm) ]]; then
              echo "Skipping deprecated/internal package: $pkg_name"
              continue
            fi
            if [[ ! "$pkg_name" =~ ^rustors- ]]; then
              echo "Skipping non-core package: $pkg_name"
              continue
            fi
            abs_pkg="$(readlink -f "$pkg")"
            echo "Publishing $pkg_name..."
            npm publish "$abs_pkg" --access public || true
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  # Publish Core to CocoaPods
  publish-cocoapods:
    name: Publish Core to CocoaPods
    runs-on: macos-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_cocoapods == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup CocoaPods
        run: gem install cocoapods
      
      - name: Validate and Publish Core CocoaPod
        working-directory: packages/ios
        run: |
          echo "=== Publishing Core Pod ==="
          pod spec lint RustO.podspec --allow-warnings --skip-import-validation || true
          pod trunk push RustO.podspec --allow-warnings || true
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        continue-on-error: true

  # Publish Python to PyPI
  publish-pypi:
    name: Publish Python to PyPI
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_pypi == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Python packages from release
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"

          mkdir -p python-dist
          gh release download "v${VERSION}" -p "rusto-*.whl" -p "rusto-*.tar.gz" -D python-dist/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Python packages before publishing
        run: |
          chmod +x scripts/verify-packed-packages.py
          python3 scripts/verify-packed-packages.py --dir python-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  # Publish Dart & Flutter to Pub.dev
  publish-pub-dev:
    name: Publish to Pub.dev
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_pub_dev == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Publish Dart package to pub.dev
        working-directory: packages/dart
        run: |
          dart pub get
          if [ -n "${{ secrets.PUB_DEV_TOKEN }}" ]; then
            dart pub publish --force || true
          else
            echo "PUB_DEV_TOKEN not configured; running dry-run validation"
            dart pub publish --dry-run || true
          fi
        env:
          PUB_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}
        continue-on-error: true

      - name: Publish Flutter package to pub.dev
        working-directory: packages/flutter
        run: |
          flutter pub get
          if [ -n "${{ secrets.PUB_DEV_TOKEN }}" ]; then
            flutter pub publish --force || true
          else
            echo "PUB_DEV_TOKEN not configured; running dry-run validation"
            flutter pub publish --dry-run || true
          fi
        env:
          PUB_TOKEN: ${{ secrets.PUB_DEV_TOKEN }}
        continue-on-error: true

  # Trigger JitPack build for Android & Java
  publish-jitpack:
    name: Trigger JitPack Build (Android & Java)
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')) ||
      github.event.inputs.publish_jitpack == 'true'
    steps:
      - name: Trigger JitPack build
        run: |
          TAG="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          echo "Triggering JitPack build for byrizki/rusto-rs tag: $TAG..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://jitpack.io/api/builds/com.github.byrizki/rusto-rs/${TAG}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "JitPack API response ($HTTP_CODE):"
          echo "$BODY"

          curl -s -I "https://jitpack.io/com/github/byrizki/rusto-rs/${TAG}/build.log" || true
          echo "JitPack build request dispatched for $TAG"
        continue-on-error: true
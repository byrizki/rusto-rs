name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '0.2.4'
      publish_crates:
        description: 'Publish to Crates.io'
        type: boolean
        required: false
        default: true
      publish_nuget:
        description: 'Publish to NuGet'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to NPM'
        type: boolean
        required: false
        default: true
      publish_cocoapods:
        description: 'Publish to CocoaPods'
        type: boolean
        required: false
        default: true

jobs:
  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish_crates == 'true' 
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        run: |
          publish_crate() {
            local pkg="$1"
            local max_attempts=4
            local delay=15
            
            for attempt in $(seq 1 $max_attempts); do
              echo "==> Publishing $pkg (Attempt $attempt/$max_attempts)..."
              output=$(cargo publish -p "$pkg" --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" 2>&1) && {
                echo "$output"
                echo "Successfully published $pkg"
                return 0
              }
              
              echo "$output"
              
              if echo "$output" | grep -qi "already uploaded\|already exists"; then
                echo "Package $pkg is already published on crates.io, skipping."
                return 0
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "Failed to publish $pkg. Retrying in ${delay}s..."
                sleep $delay
                delay=$((delay * 2))
              else
                echo "Failed to publish $pkg after $max_attempts attempts."
                return 1
              fi
            done
          }
          
          publish_crate rusto-mnn-sys
          sleep 20
          publish_crate rusto-mnn
          sleep 20
          publish_crate rusto-rs


  # Publish to NuGet
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish_nuget == 'true'    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Download NuGet package from release
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          
          # Download nupkg from GitHub release
          gh release download "v${VERSION}" -p "*.nupkg" -Dpackages/dotnet || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to NuGet
        working-directory: packages/dotnet
        run: |
          find . -name "*.nupkg" | while read pkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate || true
          done
        continue-on-error: true

  # Publish to NPM
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish_npm == 'true'    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Download NPM package from release
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Download tgz from GitHub release
          gh release download "v${VERSION}" -p "*.tgz" -D packages/react-native/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Publish to NPM
        working-directory: packages/react-native
        run: npm publish *.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  # Publish to CocoaPods
  publish-cocoapods:
    name: Publish to CocoaPods
    runs-on: macos-latest
    if: github.event_name == 'release' || github.event.inputs.publish_cocoapods == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup CocoaPods
        run: gem install cocoapods
      
      - name: Validate and Publish CocoaPods
        working-directory: packages/ios
        run: |
          echo "=== Publishing Core Pod ==="
          pod spec lint RustO.podspec --allow-warnings --skip-import-validation || true
          pod trunk push RustO.podspec --allow-warnings || true

          echo "=== Publishing Model Pods ==="
          for spec in models/*.podspec; do
            if [ -f "$spec" ]; then
              echo "Publishing $spec..."
              pod spec lint "$spec" --allow-warnings --skip-import-validation || true
              pod trunk push "$spec" --allow-warnings || true
            fi
          done
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        continue-on-error: true
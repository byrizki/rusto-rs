name: Binding Example Apps CI

on:
  # Manual artifact-consumer validation. With no run ID, use most recent
  # successful Build & Release run. A supplied ID selects exact prior run.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build & Release workflow run ID; failed runs allowed if required artifacts uploaded (blank = latest successful run)'
        required: false
        type: string
  workflow_call:
    inputs:
      release-artifact-validation:
        description: Validate consumer apps against current build artifacts.
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: binding-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  resolve-release-artifact-run:
    name: Resolve Build & Release artifact run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      run-id: ${{ steps.resolve.outputs.run-id }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID")"
          else
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0]')"
          fi

          test -n "$run_json"
          test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/build.yml

          run_id="$(jq -r '.id' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          test "$run_id" != null
          test "$head_sha" != null
          test "$status" = completed

          if [ -z "$REQUESTED_RUN_ID" ]; then
            test "$conclusion" = success
            label="latest successful"
          else
            # Explicit ID is intentional recovery mode. Artifact-producing
            # jobs may pass even when this workflow's example-validation job
            # fails, so accept completed failures and download their artifacts.
            label="explicit completed ($conclusion)"
          fi

          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Using $label Build & Release run $run_id at $head_sha"

  react-native-js:
    name: React Native ${{ matrix.app }} JS contract
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [legacy, new-arch]
    defaults:
      run:
        working-directory: examples/react-native-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Yarn Classic
        run: yarn --version
      - name: Install and build React Native package
        working-directory: packages/react-native
        run: |
          yarn install --ignore-scripts --non-interactive
          yarn prepare
      - run: yarn test --silent
        working-directory: packages/react-native
      - run: yarn typecheck
        working-directory: packages/react-native

  react-native-android-release-artifact:
    name: React Native ${{ matrix.app }} Android release artifact compile
    needs: [resolve-release-artifact-run]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_dispatch' &&
      needs.resolve-release-artifact-run.result == 'success') ||
      (github.event_name != 'workflow_dispatch' && inputs.release-artifact-validation)) }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: [legacy, new-arch]
    defaults:
      run:
        working-directory: examples/react-native-${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual validation checks out artifact-producing source revision.
          ref: ${{ needs.resolve-release-artifact-run.outputs.head-sha || github.sha }}
      # Job defaults point at consumer app, but checkout creates source tree at
      # repository root. Override before the first app-directory step exists.
      - name: Download Android artifacts from selected prior run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.resolve-release-artifact-run.outputs.run-id }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" --name rusto-android-aar --dir artifacts/rusto-android-aar
          gh run download "$ARTIFACT_RUN_ID" --name rusto-react-native-package --dir artifacts/rusto-react-native-package
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: rusto-android-aar
          path: artifacts/rusto-android-aar
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: rusto-react-native-package
          path: artifacts/rusto-react-native-package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Yarn Classic
        run: yarn --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      # Current release tarball has a new content hash on every build. Remove
      # only its generated Yarn-v1 lock stanza, then resolve it from downloaded
      # artifact; all registry dependency lock entries remain pinned.
      - name: Resolve current release NPM artifact checksum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lock = Path("yarn.lock")
          text = lock.read_text()
          prefix = '"react-native-rusto@file:../../artifacts/rusto-react-native-package/react-native-rusto.tgz":\n'
          start = text.find(prefix)
          if start < 0:
              raise SystemExit("missing react-native-rusto artifact stanza in yarn.lock")
          end = text.find("\n\n", start)
          if end < 0:
              raise SystemExit("unterminated react-native-rusto artifact stanza in yarn.lock")
          lock.write_text(text[:start] + text[end + 2:])
          PY
      - name: Install consumer dependencies from current release NPM artifact
        run: yarn install --ignore-scripts --non-interactive
      - name: Stage current release AAR
        run: |
          mkdir -p node_modules/react-native-rusto/android/libs
          find "$GITHUB_WORKSPACE/artifacts/rusto-android-aar" -name '*.aar' -exec cp {} node_modules/react-native-rusto/android/libs/ \;
          test -n "$(find node_modules/react-native-rusto/android/libs -name '*.aar' -print -quit)"
      - name: Assert artifact mode and autolinking
        run: |
          ! grep -Fq "include ':rusto-android'" android/settings.gradle
          npx react-native config > /tmp/react-native-config.json
          node -e "const c=require('/tmp/react-native-config.json'); const p=c.dependencies['react-native-rusto']?.platforms?.android; if (!p?.packageImportPath?.includes('RustoPackage')) process.exit(1)"
      - name: Assemble debug app against release AAR
        run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: examples/react-native-${{ matrix.app }}/android
      - name: Upload Android failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-native-${{ matrix.app }}-android-logs
          path: |
            examples/react-native-${{ matrix.app }}/android/.gradle/**
            examples/react-native-${{ matrix.app }}/android/app/build/reports/**
          if-no-files-found: ignore

  react-native-ios-release-artifact:
    name: React Native ${{ matrix.app }} iOS release artifact compile
    needs: [resolve-release-artifact-run]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_dispatch' &&
      needs.resolve-release-artifact-run.result == 'success') ||
      (github.event_name != 'workflow_dispatch' && inputs.release-artifact-validation)) }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app: [legacy, new-arch]
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual validation checks out artifact-producing source revision.
          ref: ${{ needs.resolve-release-artifact-run.outputs.head-sha || github.sha }}
      # Checkout creates source tree at repository root, not matrix default.
      - name: Download iOS artifacts from selected prior run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.resolve-release-artifact-run.outputs.run-id }}
        run: |
          gh run download "$ARTIFACT_RUN_ID" --name rusto-ios-xcframework --dir artifacts/rusto-ios-xcframework
          gh run download "$ARTIFACT_RUN_ID" --name rusto-react-native-package --dir artifacts/rusto-react-native-package
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: rusto-ios-xcframework
          path: artifacts/rusto-ios-xcframework
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: rusto-react-native-package
          path: artifacts/rusto-react-native-package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Yarn Classic
        run: yarn --version
      - name: Install CocoaPods
        run: gem install cocoapods
      # Current release tarball has a new content hash on every build. Remove
      # only its generated Yarn-v1 lock stanza, then resolve it from downloaded
      # artifact; all registry dependency lock entries remain pinned.
      - name: Resolve current release NPM artifact checksum
        working-directory: examples/react-native-${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lock = Path("yarn.lock")
          text = lock.read_text()
          prefix = '"react-native-rusto@file:../../artifacts/rusto-react-native-package/react-native-rusto.tgz":\n'
          start = text.find(prefix)
          if start < 0:
              raise SystemExit("missing react-native-rusto artifact stanza in yarn.lock")
          end = text.find("\n\n", start)
          if end < 0:
              raise SystemExit("unterminated react-native-rusto artifact stanza in yarn.lock")
          lock.write_text(text[:start] + text[end + 2:])
          PY
      - name: Install consumer dependencies from current release NPM artifact
        working-directory: examples/react-native-${{ matrix.app }}
        run: yarn install --ignore-scripts --non-interactive
      - name: Stage current release XCFramework
        run: |
          rm -rf packages/ios/RustO.xcframework
          # Artifact zip contains RustO.xcframework, src/, and LICENSE. Extract
          # only framework entries so tracked packages/ios/src is never replaced.
          zipinfo -1 artifacts/rusto-ios-xcframework/RustO.xcframework.zip | \
            grep '^RustO\.xcframework/' > /tmp/rusto-xcframework-files.txt
          test -s /tmp/rusto-xcframework-files.txt
          # macOS BSD unzip has no stdin file-list option. Zip has only one
          # framework root, so extract that root explicitly.
          unzip -q artifacts/rusto-ios-xcframework/RustO.xcframework.zip \
            'RustO.xcframework/*' \
            -d packages/ios
          test -d packages/ios/RustO.xcframework
      - name: Install pods from current checkout
        working-directory: examples/react-native-${{ matrix.app }}/ios
        run: pod install --repo-update
      - name: Build iOS simulator app against XCFramework
        working-directory: examples/react-native-${{ matrix.app }}
        run: >-
          xcodebuild
          -workspace ios/RustO${{ matrix.app == 'legacy' && 'LegacyExample' || 'NewArchExample' }}.xcworkspace
          -scheme RustO${{ matrix.app == 'legacy' && 'LegacyExample' || 'NewArchExample' }}
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 15'
          build
      - name: Upload iOS failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-native-${{ matrix.app }}-ios-logs
          path: |
            examples/react-native-${{ matrix.app }}/ios/Podfile.lock
            examples/react-native-${{ matrix.app }}/ios/Pods/**
          if-no-files-found: ignore

  dotnet-release-artifact:
    name: .NET release NuGet consumer compile and managed tests
    needs: [resolve-release-artifact-run]
    if: >-
      ${{ always() && ((github.event_name == 'workflow_dispatch' &&
      needs.resolve-release-artifact-run.result == 'success') ||
      (github.event_name != 'workflow_dispatch' && inputs.release-artifact-validation)) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual validation checks out artifact-producing source revision.
          ref: ${{ needs.resolve-release-artifact-run.outputs.head-sha || github.sha }}
      - name: Download NuGet artifact from selected prior run
        if: github.event_name == 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.resolve-release-artifact-run.outputs.run-id }}
        run: gh run download "$ARTIFACT_RUN_ID" --name rusto-dotnet-nupkg --dir artifacts/rusto-dotnet-nupkg
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: rusto-dotnet-nupkg
          path: artifacts/rusto-dotnet-nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: examples/dotnet/**/*.csproj
      - run: dotnet restore examples/dotnet/RustODotnet.Example.sln --source artifacts/rusto-dotnet-nupkg/nupkg --source https://api.nuget.org/v3/index.json
      - run: dotnet build examples/dotnet/RustODotnet.Example.sln --configuration Release --no-restore
      - run: dotnet test examples/dotnet/RustODotnet.Example.sln --configuration Release --no-build

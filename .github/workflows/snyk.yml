name: Snyk Security Scan

on:
  push:
    branches: [main]
    paths-ignore:
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/publish-models.yml'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/publish-models.yml'
      - '.github/workflows/publish.yml'
  schedule:
    # Run weekly automated scan on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan Rust dependencies
        run: snyk test --cargo --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Scan Node & Docs dependencies
        run: |
          cd docs && snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
